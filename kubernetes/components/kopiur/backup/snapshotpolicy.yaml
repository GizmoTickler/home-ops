---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  # Identity (<app>@<namespace>:/data) comes from the ClusterRepository's
  # identityDefaults CEL. It keeps the naming the VolSync fork used, so an app's
  # snapshots are named the same in the archived NFS repository as in this one.
  # History does NOT carry across: nas-s3 was created empty on 2026-08-10 and
  # each app re-seeds with a full snapshot on its next run.
  repository:
    kind: ClusterRepository
    name: nas-s3
  # Movers run here, not in kopiur-system; envFrom is namespace-local.
  credentialProjection:
    enabled: true
  compression:
    compressor: zstd-fastest
  copyMethod: ${KOPIUR_COPYMETHOD:=Snapshot}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=scale-snapshot}
  retention:
    keepHourly: 24
    keepDaily: 7
  upload:
    maxParallelFileReads: 2
  mover:
    cache:
      # Persistent so kopia's index/metadata cache survives between runs instead
      # of every hourly mover re-fetching it. This mattered acutely on the old
      # repository (~2.8k content-index blobs); on nas-s3 the index is small,
      # but a warm cache still saves an S3 round trip per hourly run.
      #
      # MUST NOT be node-local. openebs-hostpath is a hostPath class, so a
      # PERSISTENT cache on it would bind each app's mover to whichever node
      # first provisioned it. scale-nvmeof is network-attached, so the cache
      # follows the pod wherever it schedules.
      mode: Persistent
      capacity: ${KOPIUR_CACHE_CAPACITY:=5Gi}
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=scale-nvmeof}
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
      fsGroup: ${KOPIUR_PGID:=1000}
  sources:
    - pvc:
        name: ${APP}
      # The fork stored data under /data; the verified atuin restore confirmed
      # this resolves against the existing snapshots.
      sourcePathOverride: /data
