---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
  labels:
    # CRITICAL: existing PVCs were provisioned with
    # dataSourceRef -> volsync.backube/ReplicationDestination, which is an
    # IMMUTABLE field. Re-applying this PVC with a kopiur Restore dataSourceRef
    # would be rejected by the API server. IfNotPresent makes Flux create it
    # only on a fresh cluster (where the populator restores the volume before
    # the app starts) and never patch a bound one.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ${KOPIUR_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${KOPIUR_CAPACITY:=5Gi}
  storageClassName: ${KOPIUR_STORAGECLASS:=scale-nvmeof}
