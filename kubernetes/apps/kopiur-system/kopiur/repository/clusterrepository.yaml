---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: flashstor
spec:
  # ADOPTION, NOT CREATION. There is deliberately no `create` block: this
  # connects to the kopia repository VolSync wrote from 2025-12-10 until the
  # 2026-08-10 cutover to `nas-s3`.
  #
  # All 16 volsync apps already share ONE physical repository — same NFS export,
  # same KOPIA_PASSWORD out of the same 1Password item (verified identical
  # across auth/automation/downloads/media/self-hosted on 2026-08-09). One
  # ClusterRepository replaces what would otherwise be 16 duplicate Repository
  # objects and 16 duplicate ExternalSecrets.
  backend:
    filesystem:
      # Matches VolSync's KOPIA_REPOSITORY (filesystem:///mnt/repository) so the
      # in-pod path is identical to what wrote the repository.
      path: /mnt/repository
      volume:
        nfs:
          server: 192.168.120.10
          path: /mnt/flashstor/VolsyncKopia
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # ARCHIVED 2026-08-10. Nothing writes here any more: every SnapshotPolicy and
  # Restore now targets the `nas-s3` ClusterRepository. This object is kept
  # ONLY so the existing snapshots stay restorable, and is deleted once a
  # restore from nas-s3 is proven and a retention window has passed.
  #
  # ReadOnly + catalog.adoption: Ignore are what actually PRESERVE the archive,
  # and both are load-bearing. Repointing the policies was not enough: the
  # discovered snapshots here resolve to the same identity
  # (<app>@<namespace>:/data) as the live policies, so kopiur adopted them,
  # GFS retention took ownership, and it began pruning the archive — 467 -> 459
  # snapshots in about twenty minutes before this was applied. Ignore stops the
  # adoption; ReadOnly stops the writes.
  #
  # spec.parameters is deliberately absent: the webhook rejects a ReadOnly
  # repository that declares them, because `kopia repository set-parameters`
  # rewrites the format blob and cannot run on a read-only connection.
  #
  # Maintenance is off because it demonstrably does not work on this
  # repository: full runs take 12+ minutes, report success, reclaim 0 bytes and
  # leave the content-index blob count climbing. Running it on a read-only
  # archive would burn 12 minutes a night to achieve nothing.
  maintenance:
    enabled: false
    # Force was used ONCE on 2026-08-09 to seize the lease VolSync's fork held
    # (kopiur will not clobber an owner it does not recognise). The takeover
    # succeeded — Maintenance reported LeaseOwned=True/LeaseClaimed — so this is
    # back to the safe default. Do not leave Force set on a shared repository.
    takeoverPolicy: Never
  mode: ReadOnly
  catalog:
    # Do NOT re-attach these snapshots to the live policies; that is what put
    # them under GFS retention and started deleting them.
    adoption: Ignore
  health:
    # Silence IndexBlobHealth. The ~2.8k blobs are real and are exactly why we
    # cut over, but on an archive with maintenance disabled the condition is a
    # permanent false alarm rather than actionable signal.
    indexBlobWarnThreshold: 0
  # Movers run in the CONSUMING namespace and load the password via envFrom,
  # which is namespace-local — a ClusterRepository's Secret in kopiur-system is
  # unreachable from self-hosted/downloads/etc. This is the owner half of the
  # two-sided gate; each SnapshotPolicy/Restore must also set
  # credentialProjection.enabled: true. Verified 2026-08-09: without it a Restore
  # sits Pending on CredentialsAvailable=False/MissingCredentialsSecret.
  # Kept so the archived snapshots still resolve to the names the fork wrote
  # (<app>@<namespace>:/data) and a restore can address them. Note this exact
  # identity match is why catalog.adoption had to be set to Ignore above.
  identityDefaults:
    usernameExpr: "policyName"
    hostnameExpr: "namespace"
  credentialProjection:
    allowed: true
  # Any namespace may consume this repository. kopiur-system is implicitly
  # covered, which matters because the operator projects its own managed
  # Maintenance there and the mutating webhook rejects it otherwise -- that
  # was an explicit list entry before.
  allowedNamespaces:
    all: true
  scheduleDefaults:
    timezone: America/New_York
