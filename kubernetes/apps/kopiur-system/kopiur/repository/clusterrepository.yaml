---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: flashstor
spec:
  # ADOPTION, NOT CREATION. There is deliberately no `create` block: this
  # connects to the kopia repository VolSync has been writing since 2025-12-10,
  # so every existing snapshot is preserved and per-app history continues under
  # the identities pinned in each SnapshotPolicy (<app>@<namespace>:/data).
  #
  # All 16 volsync apps already share ONE physical repository — same NFS export,
  # same KOPIA_PASSWORD out of the same 1Password item (verified identical
  # across auth/automation/downloads/media/self-hosted on 2026-08-09). One
  # ClusterRepository replaces what would otherwise be 16 duplicate Repository
  # objects and 16 duplicate ExternalSecrets.
  backend:
    filesystem:
      # Matches VolSync's KOPIA_REPOSITORY (filesystem:///mnt/repository) so the
      # in-pod path is identical to what wrote the repository.
      path: /mnt/repository
      volume:
        nfs:
          server: 192.168.120.10
          path: /mnt/flashstor/VolsyncKopia
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  # PHASE 1 (adoption): OFF. `maintenance.enabled` defaults to TRUE, which would
  # project a Maintenance CR and run `kopia maintenance` against this repository
  # while VolSync's KopiaMaintenance (volsync-system, `0 */8 * * *`) is still the
  # owner. Two maintenance owners on one kopia repository is the exact hazard the
  # upstream docs warn about ("pick ONE owner"). VolSync stays the sole owner
  # until cutover.
  #
  # PHASE 3 (cutover): delete volsync-system/volsync/maintenance, THEN flip this
  # to true. Kopiur will not auto-clobber VolSync's unrecognized owner string, so
  # the first run after the flip needs a ONE-TIME
  # `spec.ownership.takeoverPolicy: Force` on the projected Maintenance, reverted
  # to Never immediately after.
  # ARCHIVED 2026-08-10. Nothing writes here any more: every SnapshotPolicy and
  # Restore now targets the `nas-s3` ClusterRepository. This object is kept
  # ONLY so the 466 existing snapshots stay restorable, and is deleted once a
  # restore from nas-s3 is proven and a retention window has passed.
  #
  # Maintenance is off because it demonstrably does not work on this
  # repository: full runs take 12+ minutes, report success, reclaim 0 bytes and
  # leave the content-index blob count climbing. Running it on a read-only
  # archive would burn 12 minutes a night to achieve nothing.
  maintenance:
    enabled: false
    # Force was used ONCE on 2026-08-09 to seize the lease VolSync's fork held
    # (kopiur will not clobber an owner it does not recognise). The takeover
    # succeeded — Maintenance reported LeaseOwned=True/LeaseClaimed — so this is
    # back to the safe default. Do not leave Force set on a shared repository.
    takeoverPolicy: Never
  health:
    # Silence IndexBlobHealth. The ~2.8k blobs are real and are exactly why we
    # cut over, but on an archive with maintenance disabled the condition is a
    # permanent false alarm rather than actionable signal.
    indexBlobWarnThreshold: 0
  # Movers run in the CONSUMING namespace and load the password via envFrom,
  # which is namespace-local — a ClusterRepository's Secret in kopiur-system is
  # unreachable from self-hosted/downloads/etc. This is the owner half of the
  # two-sided gate; each SnapshotPolicy/Restore must also set
  # credentialProjection.enabled: true. Verified 2026-08-09: without it a Restore
  # sits Pending on CredentialsAvailable=False/MissingCredentialsSecret.
  # Reproduces VolSync's snapshot identity for EVERY consumer, so no policy
  # needs a per-app identity block. kopia records snapshots as
  # username@hostname:path; the fork wrote <app>@<namespace>:/data, and our
  # SnapshotPolicies are named after the app and live in the app's namespace,
  # so policyName@namespace resolves identically and history continues.
  # A consumer's explicit spec.identity would still win if ever needed.
  identityDefaults:
    usernameExpr: "policyName"
    hostnameExpr: "namespace"
  credentialProjection:
    allowed: true
  # Any namespace may consume this repository. kopiur-system is implicitly
  # covered, which matters because the operator projects its own managed
  # Maintenance there and the mutating webhook rejects it otherwise -- that
  # was an explicit list entry before.
  allowedNamespaces:
    all: true
  parameters:
    # The fork's maintenance ran for months without ever compacting: kopiur
    # flagged IndexBlobHealth=False at 2752 content-index blobs against a
    # threshold of 1000, and a full maintenance run did not shift it. Cause is
    # kopia's epoch-advance gate — an epoch cannot close before minDuration
    # (default 24h) and compaction trails two epochs behind, so at 16 apps x
    # hourly (384 snapshots/day) indexes accumulate faster than epochs close.
    # 6h lets epochs turn over ~4x more often so compaction can keep up.
    #
    # 2026-08-10: 6h was NOT enough. The count went 2956 -> 2489 -> 2766, i.e.
    # it oscillates around a steady state far above the threshold rather than
    # draining. 17 schedules x hourly is ~17 index blobs/hour, so a 6h epoch
    # closes with ~100 blobs in it and compaction (two epochs behind) is always
    # ~12h stale; 2766 blobs is roughly a week of accumulation.
    #
    # The effective epoch.advanceOnCount is 20, which at this write rate is hit
    # in ~70 minutes -- so minDuration, not blob count, is the binding
    # constraint. Dropping it to 2h lets the count trigger do the work and cuts
    # the compaction lag to ~4h. Snapshot frequency is deliberately NOT reduced:
    # that would trade away RPO to fix a maintenance-tuning problem.
    epoch:
      minDuration: 2h
  scheduleDefaults:
    timezone: America/New_York
