---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    template:
      data:
        # Still the password VolSync used. The ACTIVE repository is now the S3
        # one, which would not require it — but the archived NFS repository is
        # kept readable for restores until it is decommissioned, and that one
        # cannot be re-keyed. One password covers both.
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        # SeaweedFS S3 identity scoped to the kopiur-backups bucket, NOT the
        # admin key CNPG uses: cnpg-backups returns 403 to it (verified
        # 2026-08-10). Movers consume credentials via envFrom, which is
        # namespace-local, so these ride the same Secret as KOPIA_PASSWORD and
        # are projected into app namespaces by credentialProjection.
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: volsync-template
    - extract:
        key: kopiur-s3
