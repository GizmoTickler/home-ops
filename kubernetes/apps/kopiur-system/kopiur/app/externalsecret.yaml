---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    template:
      data:
        # MUST be the same password VolSync uses — the ClusterRepository below
        # ADOPTS the existing kopia repository in place rather than creating a
        # new one, so a different password makes the repository unreadable.
        # Sourced from the same 1Password item the 16 per-app volsync
        # ExternalSecrets already extract (verified identical across all
        # namespaces on 2026-08-09).
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: volsync-template
