---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopia-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        # The whole connection descriptor lives here rather than in a ConfigMap
        # because pointing the UI at S3 means the S3 keys are part of the
        # descriptor, and kopia reads credentials from this file rather than
        # from the environment. A ConfigMap would put them in plain sight.
        #
        # This is the read-side view of the SAME repository kopiur writes:
        # bucket kopiur-backups on SeaweedFS, reached with the bucket-scoped
        # identity, never the admin key CNPG uses.
        repository.config: |
          {
            "storage": {
              "type": "s3",
              "config": {
                "bucket": "kopiur-backups",
                "endpoint": "s3.${SECRET_DOMAIN}",
                "accessKeyID": "{{ .AWS_ACCESS_KEY_ID }}",
                "secretAccessKey": "{{ .AWS_SECRET_ACCESS_KEY }}",
                "region": "us-east-1"
              }
            },
            "readonly": true,
            "hostname": "kopiur",
            "username": "viewer",
            "description": "kopiur / nas-s3",
            "enableActions": false
          }
  dataFrom:
    - extract:
        key: volsync-template
    - extract:
        key: kopiur-s3
