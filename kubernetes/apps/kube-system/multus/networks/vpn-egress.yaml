---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vpn-egress
spec:
  # VLAN 90 (192.168.90.0/24) -- same underlay as ./vpn.yaml, different policy.
  #
  # ./vpn.yaml chains `sbr`, which keeps the pod DEFAULT route on the cluster
  # CNI, so ONLY traffic a workload deliberately sources from its VLAN 90
  # address takes the tunnel. That suits qBittorrent, which binds to net1.
  #
  # This variant is for workloads that CANNOT bind to an interface (nzbget has
  # no outbound-bind setting). It carries no `sbr` and no routes: the consuming
  # pod installs them itself, sending the DEFAULT route out net1 while keeping
  # every RFC1918 destination on the cluster CNI. See the `vpn-route`
  # initContainer in apps/downloads/nzbget.
  #
  # Keeping RFC1918 on the CNI is not cosmetic. The kubelet probes a pod from
  # the NODE address (192.168.122.0/24); if that reply is routed out the tunnel
  # the probe fails, the pod never goes Ready and the Envoy route serving it
  # returns "no healthy upstream". Cluster DNS and the web UI break the same
  # way. Routing by RFC1918-vs-public rather than by destination host also
  # keeps upstream provider addresses out of this repo.
  #
  # ADDRESSING IS STATIC. Allocate from 192.168.90.10-99 only (NetBox ip-range,
  # status reserved). There is no DHCP server on this VLAN, by design.
  #
  #   [{"name":"vpn-egress","namespace":"kube-system","ips":["192.168.90.22/24"]}]
  #
  # No MAC pin here: unlike qBittorrent this path is outbound-only, so there is
  # no inbound port forward whose destination would follow a changing address.
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "vpn-egress",
      "plugins": [
        {
          "type": "macvlan",
          "master": "eth2",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        }
      ]
    }
