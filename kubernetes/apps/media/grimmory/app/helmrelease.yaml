---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory
spec:
  chartRef:
    kind: OCIRepository
    name: grimmory
  interval: 1h
  values:
    controllers:
      grimmory:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Grimmory only speaks MariaDB. Running it as a native sidecar in the same pod
          # keeps its datadir on the kopiur-backed PVC next to /app/data (one snapshot
          # covers both) and guarantees the DB is up before the app container starts.
          mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
            args:
              - --bind-address=127.0.0.1
              - --skip-name-resolve
            env:
              MARIADB_AUTO_UPGRADE: "1"
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: grimmory-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            restartPolicy: Always
        containers:
          app:
            image:
              repository: docker.io/grimmory/grimmory
              tag: v3.5.0@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
            # Bypass the root-only entrypoint (adduser + su-exec); the pod already runs as 1000.
            command: ["java", "--enable-native-access=ALL-UNNAMED", "--enable-preview", "-jar", "/app/app.jar"]
            env:
              DATABASE_URL: jdbc:mariadb://127.0.0.1:3306/grimmory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
              # Library lives on NFS and Chaptarr owns the file layout: NETWORK disables
              # move/rename/delete from the Grimmory UI so the two never fight over files.
              DISK_TYPE: NETWORK
              SERVER_PORT: &port 6060
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: grimmory-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: kgateway-internal
            namespace: network
            sectionName: https
        # No gateway OIDC: OPDS, KOReader and Kobo sync authenticate with Grimmory's own
        # credentials and would break behind a browser redirect. Grimmory has native OIDC.
        rules:
          - backendRefs:
              - identifier: app
            timeouts:
              request: 600s
              backendRequest: 600s
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          grimmory:
            app:
              - path: /app/data
                subPath: data
            mariadb:
              - path: /var/lib/mysql
                subPath: mariadb
      media:
        type: nfs
        server: 192.168.201.10
        path: /mnt/flashstor/data
        advancedMounts:
          grimmory:
            app:
              - path: /books
                subPath: media/books
              - path: /bookdrop
                subPath: media/books/bookdrop
      tmp:
        type: emptyDir
        advancedMounts:
          grimmory:
            app:
              - path: /tmp
                subPath: app-tmp
            mariadb:
              - path: /tmp
                subPath: mariadb-tmp
              - path: /run/mysqld
                subPath: mariadb-run
