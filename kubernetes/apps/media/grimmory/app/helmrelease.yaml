---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory
spec:
  chartRef:
    kind: OCIRepository
    name: grimmory
  interval: 1h
  values:
    controllers:
      grimmory:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Grimmory only speaks MariaDB. Running it as a native sidecar in the same pod
          # keeps its datadir on the kopiur-backed PVC next to /app/data (one snapshot
          # covers both) and guarantees the DB is up before the app container starts.
          mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
            args:
              - --bind-address=127.0.0.1
              - --skip-name-resolve
            env:
              MARIADB_AUTO_UPGRADE: "1"
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: grimmory-secret
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
            restartPolicy: Always
        containers:
          app:
            image:
              repository: docker.io/grimmory/grimmory
              tag: v3.5.0@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
            # Bypass the root-only entrypoint (adduser + su-exec); the pod already runs as 1000.
            command: ["java", "--enable-native-access=ALL-UNNAMED", "--enable-preview", "-jar", "/app/app.jar"]
            env:
              DATABASE_URL: jdbc:mariadb://127.0.0.1:3306/grimmory?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
              # Library lives on NFS and Chaptarr owns the file layout: NETWORK disables
              # move/rename/delete from the Grimmory UI so the two never fight over files.
              DISK_TYPE: NETWORK
              # pocket-id (id.${SECRET_DOMAIN}) resolves to a private gateway IP, which the
              # OIDC client's SSRF filter rejects. Scoped to the OIDC RestTemplate only; the
              # issuer URL itself is admin-only configuration.
              OIDC_ALLOW_UNSAFE_HOSTS: "true"
              SERVER_PORT: &port 6060
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: grimmory-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: *port
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
      # Grimmory finds new files through inotify, which never fires for writes Chaptarr
      # makes over NFS from another node. Refresh the library on a schedule instead, as a
      # least-privilege user (manage-library on the Ebooks library only).
      library-sync:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            env:
              GRIMMORY_URL: http://grimmory.media.svc.cluster.local:6060
              GRIMMORY_LIBRARY_ID: "1"
            envFrom:
              - secretRef:
                  name: grimmory-sync-secret
            command: ["/bin/sh", "-ec"]
            args:
              - |
                token=$(curl -fsS -H 'Content-Type: application/json' \
                  -d "{\"username\":\"$GRIMMORY_SYNC_USERNAME\",\"password\":\"$GRIMMORY_SYNC_PASSWORD\"}" \
                  "$GRIMMORY_URL/api/v1/auth/login" | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
                [ -n "$token" ] || { echo "login failed"; exit 1; }
                curl -fsS -X PUT -H "Authorization: Bearer $token" \
                  "$GRIMMORY_URL/api/v1/libraries/$GRIMMORY_LIBRARY_ID/refresh"
                echo "refreshed library $GRIMMORY_LIBRARY_ID"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: grimmory
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: kgateway-internal
            namespace: network
            sectionName: https
        # No gateway OIDC: OPDS, KOReader and Kobo sync authenticate with Grimmory's own
        # credentials and would break behind a browser redirect. Grimmory has native OIDC.
        rules:
          - backendRefs:
              - identifier: app
            timeouts:
              request: 600s
              backendRequest: 600s
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          grimmory:
            app:
              - path: /app/data
                subPath: data
            mariadb:
              - path: /var/lib/mysql
                subPath: mariadb
      media:
        type: nfs
        server: 192.168.201.10
        path: /mnt/flashstor/data
        advancedMounts:
          grimmory:
            app:
              - path: /books
                subPath: media/books
              - path: /bookdrop
                subPath: media/books/bookdrop
      tmp:
        type: emptyDir
        advancedMounts:
          grimmory:
            app:
              - path: /tmp
                subPath: app-tmp
            mariadb:
              - path: /tmp
                subPath: mariadb-tmp
              - path: /run/mysqld
                subPath: mariadb-run
