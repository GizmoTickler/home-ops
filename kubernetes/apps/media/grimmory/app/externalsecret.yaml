---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grimmory-secret
    template:
      data:
        # grimmory (JDBC client)
        DATABASE_USERNAME: grimmory
        DATABASE_PASSWORD: "{{ .GRIMMORY_DB_PASSWORD }}"
        # mariadb sidecar (first-boot init only; ignored once the datadir exists)
        MARIADB_DATABASE: grimmory
        MARIADB_USER: grimmory
        MARIADB_PASSWORD: "{{ .GRIMMORY_DB_PASSWORD }}"
        MARIADB_ROOT_PASSWORD: "{{ .GRIMMORY_DB_ROOT_PASSWORD }}"
  dataFrom:
    - extract:
        key: grimmory
---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-sync
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grimmory-sync-secret
    template:
      data:
        GRIMMORY_SYNC_USERNAME: "{{ .GRIMMORY_SYNC_USERNAME }}"
        GRIMMORY_SYNC_PASSWORD: "{{ .GRIMMORY_SYNC_PASSWORD }}"
  dataFrom:
    - extract:
        key: grimmory
