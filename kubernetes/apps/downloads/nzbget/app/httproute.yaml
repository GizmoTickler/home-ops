---
# Same route the app-template HelmRelease generated; the Pocket ID TrafficPolicy
# in securitypolicy.yaml targets it by name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nzbget
spec:
  hostnames:
    - nzbget.${SECRET_DOMAIN}
  parentRefs:
    - name: kgateway-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: nzbget
          port: 6789
