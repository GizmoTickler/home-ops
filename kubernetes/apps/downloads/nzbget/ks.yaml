---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nzbget
spec:
  components:
    # kopiur keeps the old k8s config PVC + backups for rollback until 2026-11-18, then remove.
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./kubernetes/apps/downloads/nzbget/app
  postBuild:
    substitute:
      APP: nzbget
      KOPIUR_CAPACITY: 15Gi
      KOPIUR_STORAGECLASS: scale-nvmeof
      KOPIUR_SNAPSHOTCLASS: scale-snapshot
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  wait: false
