---
# yamllint disable-line rule:line-length
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent-libtorrentv1
              tag: 5.2.3@sha256:8a15de24cabfca8041788773436cb176378ff7735e5cb0b2fd94984d4fac6968 # yamllint disable-line rule:line-length
            env:
              UMASK: "022"
              QBT_WEBUI_PORT: &port 80
              PUSHOVER_ENABLED: true
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            resources:
              requests:
                cpu: 2000m
                memory: 18Gi
              limits:
                memory: 32Gi
    defaultPodOptions:
      annotations:
        # Pinned IP: gateway0 DNATs the forwarded port to this exact address, so
        # a changing pod address would silently stop inbound peers.
        # Pinned MAC: macvlan generates a fresh random MAC per pod start, which
        # presents as a brand-new device to the network on every restart.
        k8s.v1.cni.cncf.io/networks: |-
          [{"name":"vpn","namespace":"kube-system","ips":["192.168.90.20/24"],"mac":"BC:24:11:90:00:20"}]
      labels:
        # Informational marker only (2026-08-12): vpn-egress-killswitch now
        # selects the stable app.kubernetes.io/name=qbittorrent label directly
        # (fail-closed — the old opt-in-by-this-label design silently disarmed
        # the kill-switch if the label was dropped). Kept as a human-readable
        # flag that this pod's non-cluster egress rides the VLAN 90 macvlan;
        # removing it changes nothing except restarting the pod.
        vpn-egress: macvlan
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        primary: true
        forceRename: *app
        ports:
          http:
            primary: true
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: kgateway-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    configMaps:
      config:
        forceRename: &configMapName "{{ .Release.Name }}-configmap"
        data:
          .qbt.toml: |-
            [qbittorrent]
            addr = "http://localhost:80"
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      config-file:
        type: configMap
        name: *configMapName
        globalMounts:
          - path: /config/.qbt.toml
            subPath: .qbt.toml
      media:
        type: nfs
        server: 192.168.120.10
        path: /mnt/flashstor/data
        globalMounts:
          - path: /media/torrents
            subPath: torrents
      inter:
        existingClaim: qbittorrent-inter
        advancedMounts:
          qbittorrent:
            app:
              - path: /inter
      tmpfs:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            app:
              - path: /config/qBittorrent/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
