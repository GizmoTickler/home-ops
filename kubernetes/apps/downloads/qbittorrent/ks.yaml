---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
spec:
  components:
    - ../../../../components/nfs-scaler
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: keda
      namespace: observability
  interval: 1h
  path: ./kubernetes/apps/downloads/qbittorrent/app
  postBuild:
    substitute:
      APP: qbittorrent
      KOPIUR_CAPACITY: 15Gi
      KOPIUR_CACHE_CAPACITY: 15Gi
      KOPIUR_STORAGECLASS: scale-nvmeof
      KOPIUR_SNAPSHOTCLASS: scale-snapshot
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: downloads
  wait: false
