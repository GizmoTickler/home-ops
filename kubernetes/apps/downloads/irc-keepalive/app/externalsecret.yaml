---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: irc-keepalive
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: irc-keepalive-secret
    template:
      data:
        IRC_NICK: "{{ .IRC_NICK }}"
        IRC_NICK_PASS: "{{ .IRC_NICK_PASS }}"
  dataFrom:
    - extract:
        key: Torrentleech
