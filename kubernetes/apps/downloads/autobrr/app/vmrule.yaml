---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: autobrr
spec:
  groups:
    - name: autobrr.rules
      rules:
        - alert: AutobrrNetworkUnmonitored
          expr: |-
            autobrr_irc_channel_enabled_total != autobrr_irc_channel_monitored_total
          for: 1h
          annotations:
            summary: >-
              {{ $labels.network }} is not being monitored by Autobrr
            description: >-
              autobrr is enabled for {{ $labels.network }} but not joined to its
              announce channel. Check the autobrr IRC log for the reason (SASL 904
              = NickServ credentials or registration). Fix within two weeks:
              NickServ registrations expire after 21 days unseen (TorrentLeech), and
              a lapsed account must be re-registered and re-grouped.
          labels:
            severity: critical
