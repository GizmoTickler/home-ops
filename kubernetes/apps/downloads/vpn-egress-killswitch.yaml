---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-egress-killswitch
spec:
  # Selects qbittorrent by its STABLE app label (2026-08-12 review fix). The
  # previous opt-in selector (vpn-egress: macvlan) was fail-open: dropping that
  # optional label — a chart refactor, a typo — silently disarmed the
  # kill-switch with zero errors. A kill-switch must fail CLOSED, so it now
  # keys on the label the pod cannot exist without.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent
  policyTypes: [Egress]
  egress:
    # Cluster-path egress is CoreDNS ONLY (udp+tcp 53). Everything else has no
    # route via the CNI, which leaves the Multus macvlan on VLAN 90 — invisible
    # to Cilium — as the sole path off-box. That turns "the app is bound to the
    # VPN interface" from a setting the app must honour into something the
    # network enforces. qbittorrent needs nothing else on the cluster path:
    # radarr/cross-seed/qui traffic is INGRESS to its API (conntrack handles
    # replies), and all peer/tracker traffic rides the VLAN 90 macvlan.
    #
    # The previous allow (namespaceSelector: {}) permitted egress to every pod
    # in every namespace — far broader than needed for a torrent client.
    #
    # Must be expressed as a selector, NOT an ipBlock of the pod/service CIDRs:
    # Cilium applies ipBlock rules to entities OUTSIDE the cluster, so a
    # 10.42.0.0/16 + 10.43.0.0/16 ipBlock silently breaks DNS and ClusterIP
    # traffic (verified against this cluster 2026-08-10).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
