---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica with a bound config PVC; a rolling update would have two
        # pods contending for the same SQLite state and the same macvlan address.
        strategy: Recreate
        initContainers:
          # configuration.yaml lives in the PVC and is rewritten wholesale by a
          # backup restore, which silently drops this block and leaves HA
          # answering 400 to everything through the gateway. Re-assert it on
          # every start so a restore cannot regress it again.
          ensure-trusted-proxies:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - sh
              - -c
              - |
                CFG=/config/configuration.yaml
                [ -f "$CFG" ] || exit 0
                # Drop a previously managed block so this is idempotent.
                sed -i '/# BEGIN managed: trusted_proxies/,/# END managed: trusted_proxies/d' "$CFG"
                # If a restore brought its own top-level http: key, appending
                # would create a duplicate mapping key and HA would refuse to
                # start. Losing the setting is recoverable; a boot loop is not.
                if grep -qE '^http:' "$CFG"; then
                  echo "existing top-level http: key present -- not managing trusted_proxies"
                  exit 0
                fi
                cat >> "$CFG" <<'EOF'
                # BEGIN managed: trusted_proxies
                http:
                  use_x_forwarded_for: true
                  trusted_proxies:
                    - 10.42.0.0/16
                # END managed: trusted_proxies
                EOF
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              # The migration landed on 2026.5.4 to match the VM exactly, so a
              # restore failure could not be confused with an upgrade failure.
              # That is now verified, and this upgrade is required: ecovacs
              # ships deebot-client 18.3.0 on 2026.5.x, which the vendor cloud
              # rejects outright with `code 1013, please update`. 2026.8.1
              # ships 18.5.1.
              tag: 2026.8.1
            env:
              TZ: America/New_York
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8123
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  # Restoring a large config and rebuilding the recorder DB on
                  # first start can take a while; fail slow rather than crash-loop.
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      annotations:
        # L2 presence on the IoT VLAN. This exists for ONE reason: wiz and lifx
        # discover by subnet BROADCAST, which cannot cross a VLAN boundary no
        # matter what is configured. Everything else HA talks to (Apple TV and
        # Shield on Trusted, MyQ on Security, UniFi/Proxmox on MGMT) is routed
        # and governed by SGACLs on SGT 12, which follows HA's IP rather than
        # its VLAN -- so the SGT binding must be re-pinned to this address.
        k8s.v1.cni.cncf.io/networks: |-
          [{"name":"iot-routed","namespace":"kube-system","ips":["192.168.136.20/22"]}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "home-assistant.${SECRET_DOMAIN}"
          - "homeassistant.${SECRET_DOMAIN}"
        parentRefs:
          - name: kgateway-internal
            namespace: network
            sectionName: https
    persistence:
      config:
        existingClaim: home-assistant
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
