---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name ia-automation-runner
spec:
  chartRef:
    kind: OCIRepository
    name: ia-automation-runner
  interval: 1h
  values:
    githubConfigUrl: https://github.com/GizmoTickler/infrastructure-automation
    githubConfigSecret: ia-automation-runner-secret
    # Jobs are bursty and infrequent: scale to zero between pushes.
    minRunners: 0
    maxRunners: 2
    runnerScaleSetName: ia-automation
    containerMode:
      type: kubernetes
      kubernetesModeWorkVolumeClaim:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 10Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command:
              - "/home/runner/run.sh"
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                # The test suite runs twice per gate and is the memory ceiling here.
                memory: 4Gi
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
        serviceAccountName: *name
        # Jobs fail with EAI_AGAIN ("Temporary failure in name resolution") under their own
        # download load while cluster DNS itself stays healthy: the glibc default of two
        # attempts at five seconds gives up on a single dropped UDP reply. Retry more, and
        # faster; pip, ansible-galaxy and go install are all idempotent on retry.
        dnsConfig:
          options:
            - name: attempts
              value: "5"
            - name: timeout
              value: "2"
            - name: single-request-reopen
