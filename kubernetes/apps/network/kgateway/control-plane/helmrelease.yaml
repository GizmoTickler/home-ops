---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
spec:
  chartRef:
    kind: OCIRepository
    name: kgateway
  dependsOn:
    - name: kgateway-crds
  interval: 1h
  values:
    # Chart default is cr.kgateway.dev/kgateway-dev, a Scarf gateway
    # (CNAME -> gateway.scarf.sh). scarf.sh currently fails DNSSEC validation
    # upstream, so that hostname does not resolve and image pulls fail with
    # "no such host". ghcr.io/kgateway-dev serves identical manifests.
    image:
      registry: ghcr.io/kgateway-dev
    controller:
      replicaCount: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    validation:
      level: standard
