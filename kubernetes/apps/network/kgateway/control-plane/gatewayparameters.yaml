---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: kgateway-proxy-params
spec:
  kube:
    envoyContainer:
      # Pull the proxy image from ghcr.io rather than the chart default
      # cr.kgateway.dev, which is a Scarf gateway (CNAME -> gateway.scarf.sh).
      # scarf.sh is both DNSSEC-broken upstream and blocked by Cloudflare
      # Gateway, so cr.kgateway.dev fails to resolve on this network.
      # ghcr.io serves the identical manifest (same digest).
      image:
        registry: ghcr.io
        repository: kgateway-dev/envoy-wrapper
      bootstrap:
        logLevel: info
      resources:
        requests:
          cpu: 80m
          memory: 512Mi
        limits:
          memory: 1Gi
    deployment:
      replicas: 2
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
    podTemplate:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
    stats:
      enabled: true
      enableStatsRoute: true
