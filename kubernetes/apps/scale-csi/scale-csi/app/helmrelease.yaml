---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scale-csi
spec:
  chartRef:
    kind: OCIRepository
    name: scale-csi
  interval: 1h
  values:
    # 2026-07-22 OOM incident: chart-default 256Mi controller limit is too small —
    # zfs.resource.snapshot.query returns ~29MB JSON per call at current snapshot
    # count (inherited tombstone-ledger props amplify every entry), and concurrent
    # VolSync CreateVolume-from-snapshot + strict-fencing startup reconcile pushed
    # the heap past the limit (crash loop, 12 restarts). 1Gi is headroom until the
    # batch-14 driver fix (single-fetch + ledger relocation) lands.
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 1Gi
    # Backend publication fencing. strict = backend allowlists converge to CSI
    # publications only (static subsystemHosts ignored for fenced volumes);
    # flipped 2026-07-22 after additive verification (27/27 converged,
    # deferred=0, double-mount drill passed).
    fencing:
      mode: "strict"
    truenas:
      host: "nas01.${SECRET_DOMAIN}"
      port: 443
      secure: true
      skipTLSVerify: false
      existingSecret: scale-csi-secret
    zfs:
      parentDataset: flashstor/scale-csi
      enforceQuota: true
      # 2026-07-22: reverted to dependent clones. detached copies (zfs send|recv via
      # replication.run_onetime) were only needed for the one-time Rook->scale-csi
      # migration (now complete). In steady state the dominant snapshot->PVC caller is
      # VolSync's HOURLY per-app source-backup mount (copyMethod: Snapshot), for which a
      # full dataset copy every hour is wasteful AND was wedging TrueNAS's replication
      # subsystem (jobs stuck at 0%, orphaned by the driver's abandon-on-timeout).
      # Clones are instant and VolSync deletes the temp source PVC before its snapshot,
      # so the clone dependency always resolves cleanly. Per-StorageClass detached
      # opt-in for real DR restores is tracked in Batch E.
      detachedVolumesFromSnapshots: false
    nfs:
      enabled: true
      server: "192.168.120.10"
      shareAllowedNetworks:
        - 192.168.122.10/32
        - 192.168.122.11/32
        - 192.168.122.12/32
    iscsi:
      enabled: true
      portal: "192.168.120.10:3260"
    nvmeof:
      enabled: true
      transport: tcp
      address: "192.168.201.10"
      port: 4420
      # GF-5 node-half multipath (v1.7.0): each address below gets an nvmet port
      # association; NodeStage connects every advertised path and native NVMe
      # multipath aggregates them (queue-depth iopolicy). VLANs 1201-1204 are
      # L2-direct storage links on the k8s VMs (net3-net6, mtu 9000), verified
      # 12/12 jumbo + TCP/4420 from all nodes 2026-08-16.
      # 2026-08-26: `address` flipped off MGMT (192.168.120.10) to the fabric.
      # multipathAddresses() is TransportAddress-first then Addresses, dedup'd,
      # so this yields exactly the four 1201-1204 paths and no MGMT path. The
      # MGMT portal was carrying ~100 GiB/day across SC01 and onto the SPAN.
      # Existing subsystems keep their old port association until the nvmet
      # port_subsys rows for the MGMT port are deleted -- that is a data-plane
      # migration, not a Helm value.
      multipath: true
      addresses:
        - "192.168.201.10"
        - "192.168.202.10"
        - "192.168.203.10"
        - "192.168.204.10"
      # Secure-by-default: only these Kubernetes node NQNs may connect
      # (nvme show-hostnqn per node; machine-id-derived, stable on Flatcar).
      subsystemAllowAnyHost: false
      subsystemHosts:
        - nqn.2014-08.org.nvmexpress:uuid:cce109e7-813a-4b2b-9314-c35b7064e3dd
        - nqn.2014-08.org.nvmexpress:uuid:0c2178cc-5aa6-45f3-bafe-718fe518fa62
        - nqn.2014-08.org.nvmexpress:uuid:2121dcbe-603f-46ec-b21a-b3dbad9d5f04
    storageClasses:
      - name: scale-nvmeof
        protocol: nvmeof
        isDefault: true
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
      - name: scale-iscsi
        protocol: iscsi
        isDefault: false
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
      - name: scale-nfs
        protocol: nfs
        isDefault: false
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions:
          - nfsvers=4
          - noatime
    snapshotClass:
      create: true
      name: scale-snapshot
      deletionPolicy: Delete
    reconcile:
      # 2026-07-23: relocate tombstone ledger + in-flight markers off the
      # inheritable parent dataset (v1.2.31 batch 14). Root cause of the
      # 2026-07-22 controller OOM loop: dependent-clone deferred deletes wrote
      # ledger entries (+16/h) as inheritable parent properties, so every
      # snapshot carried the full ledger -> 35MB snapshot-query payloads.
      # Writes go to a non-inheriting .csi-bookkeeping child with lossless
      # dual-read migration.
      # 2026-07-24: soak complete — 04:00Z GC confirmed parent backlog fully
      # drained (orphanVolumes=0, orphanSnapshots=0, spentRestoreSnapshots=0),
      # so parent-side entries may now be removed after confirmed copy.
      bookkeeping:
        enabled: true
        cleanupParent: true
      # 2026-07-26: v1.3.0 scan-based reaper fallback. The July-22 OOM window
      # renamed 293 tombstone snapshots (~2.6GiB) BEFORE the ledger relocation,
      # so they have no ledger entry and the ledger-driven reaper can never
      # touch them. The fallback reaps only candidates with surviving
      # driver-written snapshot identity + exact rename-algorithm match + fresh
      # dual-ledger absence + dependent-clone preflight; anything less proven
      # is counted as manualRecoveryTombstones and NEVER deleted. Watch the
      # first 04:20 delete run: reapedTombstones should include the cohort and
      # manualRecoveryTombstones must stay 0.
      tombstoneReaper:
        scanFallback:
          enabled: true
      delete:
        # Gated GC: this CronJob is the ONLY delete-capable reconcile. The
        # in-controller loop (reconcile.interval=1h) is detection-only
        # (Delete:false).
        #
        # maxPerRun is NOT a single pass-wide mutation ceiling. In v1.10.4:
        #   deleteDetectedOrphans shares ONE counter across orphan volumes,
        #   orphan snapshots, tombstones, spent-restore snapshots, and
        #   remnants (no per-type split inside that group).
        #   deleteOrphanedShares has its own independent allowance of up
        #   to maxPerRun (counts DeletedShares separately).
        #   adoptLegacyOwnershipStamps and migrateLegacyPropertyNamespace
        #   each independently receive the full maxPerRun as their own
        #   write cap.
        #   sweepStrandedSnapshotTasks is uncapped.
        # There is no upper-bound validation on the value.
        #
        # kopiur SnapshotSchedules (H * * * *) leave a deferred-delete
        # tombstone when the mover's *-src clone PVC is deleted while its
        # VolumeSnapshot still has a live clone. Measured inflow:
        #   17/h = 408/day
        # v1.10.4 tombstoneMinAge=1h (was minOrphanAge=24h) made the
        # waiting cohort age-eligible in one shot (776 at review). One
        # 04:20 pass of 500 cannot drain 776 + 408/day of new inflow.
        #
        # 4x daily at :20 (kept off the top of the hour so in-flight VSCs
        # without status.snapshotHandle do not fail-close the orphan
        # pass). Worst wait between delete-capable passes is 6h.
        # Steady-state eligible peak after the 776 spike drains:
        #   17/h * (6h window - 1h tombstoneMinAge) = 85
        # Tombstone worst-case after a full 6h wait:
        #   776 already-eligible + 85 newly aged = 861
        # Cap 1000 leaves 139 (~16%) over that 861 for the other shared
        # categories (orphans and spent-restore have been 0 since the
        # 2026-07-24 soak, so the extra is buffer, not measured load)
        # without a large migration blast radius.
        # Daily capacity 4*1000 = 4000 vs 408 inflow (~9.8x).
        enabled: true
        schedule: "20 4,10,16,22 * * *"
        maxPerRun: 1000
