---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/rbac.authorization.k8s.io/role_v1.json
# The chart decides whether to grant the controller `get` on Secrets from the
# CURRENTLY RENDERED StorageClass parameters (scale-csi.storageClassNeedsControllerSecretGet)
# OR encryption.enabled. Neither is true for this release, so v1.11.1 renders no
# secrets rule at all.
#
# That predicate misses already-provisioned PVs. A PV's spec.csi.*SecretRef is
# stamped at provision time and outlives any later StorageClass change, so the 12
# PVs created on 2026-07-20 still carry controllerPublishSecretRef /
# controllerExpandSecretRef / nodeStageSecretRef -> scale-csi/scale-csi-secret.
# Once the rule disappeared, every controller-side secret read for those volumes
# became Forbidden and AttachVolume.Attach failed permanently:
#
#   AttachVolume.Attach failed for volume "pvc-32387855-...": failed to load
#   secret "scale-csi/scale-csi-secret": secrets "scale-csi-secret" is forbidden:
#   User "system:serviceaccount:scale-csi:scale-csi-controller" cannot get
#   resource "secrets" in API group "" in the namespace "scale-csi"
#
# Affected PVs span downloads/{radarr,sonarr}-cache, media/seerr-cache,
# database/netbox-postgres-{1,2,3} and observability/{grafana,vmsingle,
# vmalertmanager-0,vmalertmanager-1,victoria-logs,gatus} — so a node reboot would
# take out the observability stack and the NetBox database.
#
# This Role restores exactly the missing access, namespace-scoped and restricted
# by name to the single Secret those PVs reference, rather than the chart's
# cluster-wide get on all Secrets. Remove it once the chart gate also accounts
# for secret refs on existing PVs and this release runs a version carrying that
# fix.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scale-csi-controller-pv-secret
  namespace: scale-csi
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["scale-csi-secret"]
    verbs: ["get"]
---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scale-csi-controller-pv-secret
  namespace: scale-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scale-csi-controller-pv-secret
subjects:
  - kind: ServiceAccount
    name: scale-csi-controller
    namespace: scale-csi
