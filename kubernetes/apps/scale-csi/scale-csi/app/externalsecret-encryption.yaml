---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/externalsecret_v1.json
# Per-volume encryption passphrase for scale-csi (GF-Sprint 1, v1.6.0).
#
# 1Password is the SOURCE OF TRUTH; this Secret is derived. That inversion is
# the whole point: TrueNAS does not persist a passphrase key
# (encryption_summary reports key_present_in_database: false), so before this
# the Kubernetes Secret was the only copy in existence and losing it meant the
# encrypted data was unrecoverable — there is no escrow. With the key held in
# the Infrastructure vault, a lost or rebuilt Secret is re-synced, not fatal.
#
# Rotation (driver E-3, two-key window): add ENCRYPTION_PASSPHRASE_PREVIOUS to
# the 1Password item carrying the OLD value, set ENCRYPTION_PASSPHRASE to the
# new one, and uncomment passphrasePrevious below. The driver unlocks with the
# previous key and re-keys to the current one on the next publish, emitting an
# EncryptionRotated event. KEEP the previous value until that event is observed
# for every encrypted volume — removing it early strands any volume that has
# not yet converged.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scale-csi-encryption
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: scale-csi-encryption-secret
    template:
      data:
        passphrase: "{{ .ENCRYPTION_PASSPHRASE }}"
        algorithm: "{{ .ENCRYPTION_ALGORITHM }}"
        # passphrasePrevious: "{{ .ENCRYPTION_PASSPHRASE_PREVIOUS }}"
  dataFrom:
    - extract:
        key: scale-csi-encryption
