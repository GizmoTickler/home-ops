---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: scale-csi-rules
spec:
  groups:
    - name: scale-csi.rules
      rules:
        - alert: ScaleCSITrueNASConnectionDown
          expr: |-
            scale_csi_truenas_connection_status{job="scale-csi-controller-metrics"} == 0
          for: 5m
          annotations:
            summary: >-
              scale-csi controller has lost its TrueNAS API connection — provisioning,
              attach and delete operations will fail until it reconnects
          labels:
            severity: critical
        - alert: ScaleCSIOrphanedBackendObjects
          expr: |-
            (scale_csi_orphan_volumes > 0) or (scale_csi_orphan_snapshots > 0)
          for: 2h5m
          annotations:
            summary: >-
              scale-csi reconcile detected {{ $value }} orphaned backend object(s) on
              TrueNAS with no live Kubernetes owner — the 6-hourly gated GC will clean
              them once aged, or investigate with the driver's reconcile report
          labels:
            severity: warning
        - alert: ScaleCSIControllerMetricsAbsent
          expr: |-
            absent(scale_csi_truenas_connection_status{job="scale-csi-controller-metrics"}) == 1
          for: 10m
          annotations:
            summary: >-
              scale-csi controller metrics have vanished — the controller is down or
              its scrape target is broken; no provisioning or GC activity is observable
          labels:
            severity: critical
        - alert: ScaleCSISustainedOperationErrors
          expr: |-
            sum by (operation, code) (rate(scale_csi_operations_total{job="scale-csi-controller-metrics",status="error",code!~"FailedPrecondition|AlreadyExists|Aborted"}[10m])) > 0.02
          for: 15m
          annotations:
            summary: >-
              scale-csi is sustaining unexpected-code operation failures ({{ $value }}/s
              by operation/code) — expected lifecycle rejections are excluded; investigate
              the controller logs for the failing operations
          labels:
            severity: warning
        - alert: ScaleCSIVolumeStuckReleased
          expr: |-
            max by (persistentvolume) (
              kube_persistentvolume_status_phase{phase="Released"} == 1
            )
            and on(persistentvolume)
            max by (persistentvolume) (
              kube_persistentvolume_info{reclaim_policy="Delete",csi_driver="csi.scale.io"}
            )
          for: 8h
          annotations:
            summary: >-
              scale-csi PersistentVolume {{ $labels.persistentvolume }} has been
              Released for over 8h — that is tombstoneMinAge (1h) plus the
              worst-case wait for the next delete-capable reap (6h at
              04:20/10:20/16:20/22:20) plus slack, so this is not a normal
              deferred-delete waiting for the next pass; inspect the PV and
              the scale-csi-reconcile CronJob log for why the backend object
              was not deleted
          labels:
            severity: warning
        - alert: ScaleCSISpentRestoreBacklog
          expr: |-
            max(scale_csi_spent_restore_snapshots{job="scale-csi-controller-metrics"}) > 0
          for: 48h
          annotations:
            summary: >-
              spent VolSync-restore snapshots have outlived the 6-hourly GC window —
              the gated delete CronJob may be failing or the snapshots are not ageing
              out as expected
          labels:
            severity: warning
        - alert: ScaleCSISessionGCDisconnects
          expr: |-
            increase(scale_csi_gc_sessions_disconnected_total[1h]) > 0
          for: 5m
          annotations:
            summary: >-
              session GC disconnected {{ $value }} session(s) in the last hour — verify
              these were truly orphaned and not active volumes affected by a pod churn
              or node restart race
          labels:
            severity: warning
        - alert: ScaleCSITombstoneBacklogNearCap
          expr: |-
            max(scale_csi_tombstone_snapshots{job="scale-csi-controller-metrics"}) > 900
          for: 30m
          annotations:
            summary: >-
              {{ $value }} deferred-delete tombstones are awaiting reap —
              within striking distance of the 1000 per-pass cap (90%), so the
              next 6-hourly pass may start deferring work (skippedOnCap);
              check kopiur *-src clone churn against reconcile.delete.maxPerRun
              and the scale-csi-reconcile CronJob's last run
          labels:
            severity: warning
        - alert: ScaleCSITombstoneReapStalled
          expr: |-
            (
              time() - max(kube_cronjob_status_last_successful_time{namespace="scale-csi",cronjob="scale-csi-reconcile"}) > 25200
            )
            or
            absent(kube_cronjob_status_last_successful_time{namespace="scale-csi",cronjob="scale-csi-reconcile"}) == 1
          for: 15m
          annotations:
            summary: >-
              scale-csi-reconcile last-success is stale or unobservable —
              the CronJob object may be missing, it may never have succeeded,
              kube-state-metrics may be unavailable, or the last success
              exceeded the 6-hourly delete-capable schedule
              (04:20/10:20/16:20/22:20) plus slack; check the CronJob,
              kube-state-metrics, and the last Job log
          labels:
            severity: warning
        - alert: ScaleCSIReconcileStale
          expr: |-
            time() - max(scale_csi_reconcile_last_success_timestamp_seconds{job="scale-csi-controller-metrics"}) > 7200
          for: 15m
          annotations:
            summary: >-
              scale-csi reconcile has not recorded a success in over 2h —
              the periodic detection loop should update this timestamp even
              when there is nothing to delete; check the controller is
              running and its log is not wedged on a reconcile
          labels:
            severity: warning
        - alert: ScaleCSIManualRecoveryTombstones
          expr: |-
            max(scale_csi_manual_recovery_tombstones{job="scale-csi-controller-metrics"}) > 0
          for: 1h
          annotations:
            summary: >-
              {{ $value }} tombstoned snapshot(s) have unproven creation-time identity and
              the guarded reaper refuses to touch them — these never clear on their own;
              inspect them on nas01 and resolve manually per the driver docs
          labels:
            severity: warning
