---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
spec:
  chartRef:
    kind: OCIRepository
    name: kured
  interval: 1h
  values:
    configuration:
      # Use the command sentinel (run on the host via nsenter) rather than the
      # mounted /sentinel hostPath file checker, so it can also see rpm-ostree /
      # update_engine.
      # The chart only emits --reboot-sentinel-command when this is false.
      useRebootSentinelHostPath: false
      # Check for pending reboots every 10 minutes.
      period: 10m0s
      # Reboot only one node at a time. With a 3-node control plane this keeps
      # etcd quorum (2/3) and lets kube-vip fail the API VIP over cleanly.
      concurrency: 1
      # NO lock auto-expiry: if a rebooted node wedges and never comes back Ready,
      # an expiring lock would let a SECOND control-plane node reboot — 2/3 down
      # kills etcd quorum. A stuck lock blocks further reboots (safe) and is
      # released manually: kubectl -n system-upgrade annotate ds kured weave.works/kured-node-lock-
      lockTtl: 0
      # Reboot when ANY of:
      #   - /run/reboot-required exists (touched by systemd-sysupdate on Flatcar);
      #   - Fedora CoreOS: rpm-ostree has a pending deployment (staged by the fcos-os
      #     Plan; Zincati is disabled) — deployments[0] is the next boot, so it is
      #     not the booted one. `jq -e` fails closed: an rpm-ostree error is NOT a
      #     reboot request;
      #   - Flatcar: update_engine has staged an OS update (locksmithd is masked).
      # kured prepends `nsenter -m/proc/1/ns/mnt --`, so this runs in the host mount ns.
      rebootSentinelCommand: '/usr/bin/sh -c "test -f /run/reboot-required || { test -x /usr/bin/rpm-ostree && /usr/bin/rpm-ostree status --json | /usr/bin/jq -e ''.deployments[0].booted == false'' >/dev/null; } || { test -x /usr/bin/update_engine_client && /usr/bin/update_engine_client -status | /usr/bin/grep -q UPDATE_STATUS_UPDATED_NEED_REBOOT; }"'
      rebootMethod: command
      rebootCommand: /usr/bin/systemctl reboot
