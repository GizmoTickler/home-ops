---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: network-infra-alerts
spec:
  groups:
    # DNS/DHCP Server Alerts
    - name: dns-dhcp.rules
      interval: 30s
      rules:
        - alert: DNSServerDown
          expr: |-
            probe_success{job="probe/observability/dns"} == 0
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "DNS server {{ $labels.instance }} is down"
            description: |-
              TCP probe to DNS port 53 on {{ $labels.instance }} has been failing for over 5 minutes.
              DHCP clients may lose DNS resolution if both servers fail.
          labels:
            severity: warning
            component: dns

        - alert: DNSAllServersDown
          expr: |-
            count(probe_success{job="probe/observability/dns"} == 0)
              == count(probe_success{job="probe/observability/dns"})
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "All DNS servers are down"
            description: |-
              Every probed DNS target (dns0, dns1 and the 10.53.53.53 anycast address)
              is unreachable on port 53.
              All DNS resolution for the network is offline. Immediate action required.
          labels:
            severity: critical
            component: dns

        - alert: DHCPPrimaryDown
          expr: |-
            probe_success{job="probe/observability/devices",instance=~"dns0.*"} == 0
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "Primary DHCP server (dns0) is down"
            description: |-
              ICMP probe to dns0 has been failing for over 5 minutes.
              Kea HA standby (dns1) should take over DHCP serving.
              Investigate dns0 VM on TrueNAS.
          labels:
            severity: warning
            component: dhcp

        - alert: DHCPAllServersDown
          expr: |-
            count(probe_success{job="probe/observability/devices",instance=~"dns-[01].*"} == 0) == 2
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "All DHCP servers are down"
            description: |-
              Both dns0 and dns1 are unreachable via ICMP.
              No DHCP leases can be issued or renewed. Existing clients retain leases until expiry.
              Immediate action required.
          labels:
            severity: critical
            component: dhcp

        # Escalation: 30m of dead replication means the multi-master nodes are
        # silently DIVERGING (writes land on one node only). The 2026-08-22
        # PG-18.6/output_plugin_libraries incident ran 11h at severity=warning
        # before anyone acted — this tier makes the divergence page as critical.
        - alert: ReplicationSlotInactiveLong
          expr: |-
            pg_replication_slot_slot_is_active{job="postgres-exporter"} == 0
          for: 30m
          keep_firing_for: 5m
          annotations:
            summary: "Spock slot {{ $labels.slot_name }} inactive >30m — nodes are diverging"
            description: |-
              Multi-master replication has been down for 30+ minutes; DNS/DHCP
              writes are landing on one node only and the datasets are diverging.
              Runbook: check output_plugin_libraries first (PG minor upgrades can
              break Spock BY POLICY — see claude-config runbooks/proposals/dns-anycast §23.1).
          labels:
            severity: critical
        - alert: ReplicationSlotInactive
          expr: |-
            pg_replication_slot_slot_is_active{job="postgres-exporter"} == 0
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "Spock replication slot {{ $labels.slot_name }} inactive on {{ $labels.instance }}"
            description: |-
              Slot {{ $labels.slot_name }} on {{ $labels.instance }} has been inactive for 5m.
              WAL will accumulate until max_slot_wal_keep_size (4GB). Investigate Spock subscription health.
          labels:
            severity: warning
            component: postgres

        - alert: ReplicationLagHigh
          expr: |-
            (pg_replication_slot_slot_current_wal_lsn{job="postgres-exporter"} - pg_replication_slot_slot_confirmed_flush_lsn{job="postgres-exporter"}) > 52428800
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "Spock replication lag >50MB for slot {{ $labels.slot_name }}"
            description: |-
              Slot {{ $labels.slot_name }} on {{ $labels.instance }} has >50MB unreplicated WAL for 10m.
              Multi-master sync is lagging; writes on other node not yet applied locally.
          labels:
            severity: warning
            component: postgres

        # NOTE: KeaHAUnsentUpdatesHigh removed 2026-04-17 — kea-exporter (Python
        # patched for Kea 3.0) does not emit kea_ha_unsent_update_count or any
        # kea_*_ha_* metrics. If HA visibility is needed, use the Kea HA status
        # command via control agent and a custom exporter.

        - alert: DNSCacheHitRatioLow
          # 3-layer cache architecture (2026-04-07): dnsdist (200K entries, minTTL=60s)
          # fronts recursor (100K record, 50K packet cache). dnsdist absorbs most repeat
          # queries, so the recursor sees mostly unique/fresh queries — a low RECURSOR
          # packet-cache hit ratio in isolation is EXPECTED and not a regression. We now
          # measure the EFFECTIVE 3-layer hit ratio: a query is a "hit" if it is served
          # from either the dnsdist packet cache OR the recursor packet cache, i.e. did
          # not require a recursor lookup beyond the packet cache.
          #   (dnsdist_hits + recursor_packetcache_hits) / total_queries
          # Total queries are taken from dnsdist_queries (all queries ingress the stack
          # through dnsdist). Threshold: <70% (cluster-wide steady state ~85-90%).
          #
          # 2026-05-02: switched to CLUSTER-WIDE aggregation. The previous per-host
          # formula was load-bearing-broken: each host's dnsdist forwards round-robin
          # to BOTH recursors, so the recursor packetcache_hits on host X include cross-
          # host traffic, while dnsdist_queries on host X only counts local ingress.
          # That mismatch produced numbers that exceeded 100% on the lighter-loaded
          # node and dipped well below 70% on the busier node, generating chronic
          # info-severity false positives. Cluster-wide aggregation is exact under
          # active/active load balancing and is what we actually care about: the user-
          # facing cache effectiveness across the HA pair.
          expr: |-
            (
              sum(rate(dnsdist_cache_hits{job="dnsdist"}[15m]))
              +
              sum(rate(pdns_recursor_packetcache_hits{job="pdns-recursor"}[15m]))
            )
            /
            clamp_min(sum(rate(dnsdist_queries{job="dnsdist"}[15m])), 1)
            < 0.7
          for: 1h
          keep_firing_for: 5m
          annotations:
            summary: "Effective DNS cache hit ratio <70% (cluster-wide)"
            description: |-
              Combined dnsdist + recursor packet cache hit ratio: {{ $value | humanizePercentage }} for 1h.
              Typical healthy value is 85-90%. Likely a warming period after restart, unusual query
              mix, or a cache configuration regression in the 3-layer stack.
          labels:
            severity: info
            component: dns

        # NOTE: DNSZoneSerialDrift removed 2026-04-17 — the PowerDNS Auth
        # built-in Prometheus exporter does not expose per-zone SOA serial
        # (pdns_authoritative_zone_soa_serial does not exist). Zone drift is
        # instead covered indirectly by Spock ReplicationSlotInactive /
        # ReplicationLagHigh on the postgres-exporter. If per-zone visibility
        # is needed, scrape the PowerDNS HTTP API /servers/localhost/zones.

        - alert: KeepalivedVIPFlap
          # dns_keepalived_is_master is a textfile-collector metric on each
          # node-exporter (dns0/dns1:9100). Count state changes across both
          # instances; a healthy stable state has 0 changes in 10m.
          expr: |-
            sum(changes(dns_keepalived_is_master{job="node-exporter",instance=~"dns[01].*"}[10m])) > 4
          for: 0m
          keep_firing_for: 15m
          annotations:
            summary: "Keepalived DNS VIP flapped {{ $value }} times in 10m"
            description: |-
              The DNS VIP (192.168.123.249) changed master/backup state repeatedly across dns0/dns1.
              Health check may be flapping; investigate check-dns-health.sh and network between nodes.
          labels:
            severity: warning
            component: dns

        - alert: KeepalivedNoMaster
          # Either: no master elected (sum == 0) or split-brain (sum > 1)
          expr: |-
            sum(dns_keepalived_is_master{job="node-exporter",instance=~"dns[01].*"}) != 1
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "Keepalived DNS VIP election unhealthy (count={{ $value }})"
            description: |-
              Expected exactly 1 master for the DNS VIP. Current master count: {{ $value }}.
              0 = no master (VIP offline); >1 = split-brain (both nodes claim master).
          labels:
            severity: critical
            component: dns

        # DNS stack backup freshness — added 2026-08-20 with the dns-stack-backup
        # timers (nightly pg_dump of pdns/kea/stork + /etc tarball on each node,
        # 03:15 dns0 / 03:35 dns1). The backup script writes this textfile metric
        # only on a fully successful run, so staleness = failed or stuck backups.
        # Spock replication is HA, not backup — these dumps are the only
        # point-in-time recovery layer for zones/DNSSEC keys/leases.
        - alert: DNSStackBackupStale
          expr: |-
            (time() - dns_stack_backup_last_success_timestamp_seconds{job="node-exporter",instance=~"dns[01].*"}) > 93600
          for: 30m
          keep_firing_for: 1h
          annotations:
            summary: "DNS stack backup stale on {{ $labels.instance }} ({{ $value | humanizeDuration }} old)"
            description: |-
              dns-stack-backup.service has not completed successfully in >26h on this node.
              Check: systemctl status dns-stack-backup.{service,timer} and /var/backups/dns-stack/.
          labels:
            severity: warning
            component: dns

        - alert: DNSStackBackupMetricMissing
          # Both nodes must report the freshness metric; fewer than 2 series means
          # a node-exporter textfile problem or the backup unit was removed.
          expr: |-
            (count(dns_stack_backup_last_success_timestamp_seconds{job="node-exporter",instance=~"dns[01].*"}) or vector(0)) < 2
          for: 1h
          keep_firing_for: 1h
          annotations:
            summary: "DNS stack backup metric missing (series count {{ $value }}, expected 2)"
            description: |-
              dns_stack_backup_last_success_timestamp_seconds is absent for one or both DNS nodes.
              Verify the dns-stack-backup timer exists and /var/lib/node_exporter/textfile/dns_backup.prom is written.
          labels:
            severity: warning
            component: dns

        # Upstream watchdog — added 2026-08-20. dns-upstream-watchdog probes CF
        # Gateway DoH every 30s and swaps dnscrypt-proxy to UNFILTERED Google DoH
        # after 3 consecutive failures (auto-restores after 5 successes). While
        # the fallback is active there is NO Zero Trust DNS filtering — this must
        # never be a silent state.
        - alert: DNSUpstreamFallbackActive
          expr: |-
            max by (instance) (dns_upstream_fallback_active{job="node-exporter",instance=~"dns[01].*"}) == 1
          for: 1m
          keep_firing_for: 10m
          annotations:
            summary: "UNFILTERED Google DoH fallback active on {{ $labels.instance }}"
            description: |-
              dnscrypt-proxy on this node is using the Google public DoH fallback — CF Gateway
              filtering is BYPASSED. Auto-restore happens when Gateway probes recover; if this
              persists, CF Gateway is down or a manual break-glass was left active
              (dns-upstream-breakglass status / restore).
          labels:
            severity: warning
            component: dns

        - alert: DNSUpstreamWatchdogStale
          expr: |-
            (time() - dns_upstream_watchdog_last_run_timestamp_seconds{job="node-exporter",instance=~"dns[01].*"}) > 600
          for: 5m
          keep_firing_for: 15m
          annotations:
            summary: "DNS upstream watchdog not running on {{ $labels.instance }}"
            description: |-
              dns-upstream-watchdog.timer has not ticked in >10m — automatic Google-DoH failover
              for CF Gateway outages is not armed on this node.
          labels:
            severity: warning
            component: dns

    # DNS Resolver Health Alerts
    # Added 2026-06-10 after a DNSSEC trust-anchor gap made the recursors return
    # SERVFAIL (EDE 12) for all guest/IoT reverse-PTR lookups, undetected until
    # iPhones froze. These alerts make that class of silent resolver failure
    # page automatically. Metric names verified live against Victoria Metrics:
    #   pdns_recursor_*  (job="pdns-recursor", instance dns[01]:8092)
    #   dnsdist_*        (job="dnsdist",        instance dns[01]:8083)
    #   dnscrypt_proxy_* (job="dnscrypt-proxy", instance dns[01]:49312)
    # Anycast DNS data plane (10.53.53.53, prepend-gate design — see
    # claude-config runbooks/dns-anycast-incident.md)
    - name: dns-anycast.rules
      interval: 30s
      rules:
        - alert: DNSAnycastBothDemoted
          expr: |-
            sum(dns_anycast_demoted) >= 2
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "Both DNS nodes report dnsdist unhealthy — anycast degraded on both"
            description: |-
              Both gates have applied ANYCAST_OUT_DEGRADED. Traffic still flows
              (equal-length paths ECMP), but the gate believes neither dnsdist is
              answering — either both are broken, or the shared probe is lying.
              Verify with dig against each node's PHYSICAL address first.
            runbook_url: "https://github.com/GizmoTickler/claude-config/blob/main/infra/runbooks/dns-anycast-incident.md#dnsanycastbothdemoted--critical"
          labels:
            severity: critical
        - alert: DNSAnycastNodeDemoted
          expr: |-
            dns_anycast_demoted == 1
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "{{ $labels.instance }} demoted from anycast ECMP for >10m"
            description: |-
              Service is fine on the peer; redundancy is reduced. Likely dnsdist
              down/hung on the node, gate stopped for maintenance, or a node that
              booted and never promoted.
            runbook_url: "https://github.com/GizmoTickler/claude-config/blob/main/infra/runbooks/dns-anycast-incident.md#dnsanycastnodedemoted--warning-10m"
          labels:
            severity: warning
        - alert: DNSAnycastMetricMissing
          expr: |-
            absent(dns_anycast_healthy) or count(dns_anycast_healthy) < 2
          for: 15m
          keep_firing_for: 5m
          annotations:
            summary: "Anycast gate metrics missing for one or both DNS nodes"
            description: |-
              dns_anycast_* gauges absent — the gate daemon or its textfile
              publication may not be running on one or both nodes.
            runbook_url: "https://github.com/GizmoTickler/claude-config/blob/main/infra/runbooks/dns-anycast-incident.md#first-commands-always"
          labels:
            severity: warning
    - name: dns-resolver.rules
      interval: 30s
      rules:
        # --- The headline incident signal: recursor SERVFAIL rate ---
        - alert: RecursorServfailRateHigh
          # pdns_recursor_servfail_answers is the recursor's SERVFAIL counter.
          # Healthy baseline is ~0/s. Today's DNSSEC gap drove this up for every
          # affected lookup. >1/s sustained for 5m is well above noise and would
          # have caught the incident long before users complained.
          expr: |-
            rate(pdns_recursor_servfail_answers{job="pdns-recursor"}[5m]) > 1
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "Recursor SERVFAIL rate elevated on {{ $labels.instance }}"
            description: |-
              PowerDNS Recursor on {{ $labels.instance }} is returning {{ $value | humanize }} SERVFAIL/s (5m rate).
              Healthy baseline is ~0/s. Likely cause: DNSSEC trust-anchor gap, upstream resolver
              failure, or broken forwarding. Cross-check RecursorDNSSECBogusIncreasing and
              dnscrypt upstream health. This is the signal class that caused the 2026-06-10
              guest/IoT reverse-PTR outage.
          labels:
            severity: critical
            component: dns

        - alert: DnsdistServfailRateHigh
          # dnsdist front-of-VIP SERVFAIL responses to clients. This catches the
          # user-facing symptom even if the recursor counter is reset/missed, and
          # covers SERVFAILs dnsdist itself synthesizes. Same ~0/s baseline.
          expr: |-
            rate(dnsdist_servfail_responses{job="dnsdist"}[5m]) > 1
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "dnsdist is returning SERVFAIL to clients on {{ $labels.instance }}"
            description: |-
              dnsdist on {{ $labels.instance }} returned {{ $value | humanize }} SERVFAIL/s to clients (5m rate).
              This is what end users actually experience. Likely a recursor backend failure or
              a DNSSEC/upstream problem propagating through the VIP. Check RecursorServfailRateHigh
              and DnsdistBackendDown.
          labels:
            severity: critical
            component: dns

        # --- The exact silent signal from the 2026-06-10 incident ---
        - alert: RecursorDNSSECBogusIncreasing
          # Sum of all pdns_recursor_dnssec_result_bogus* counters.
          # Baseline drifted to a sustained ~0.17/s (<1% of queries, internet
          # background bogus via the CF-Gateway forwarding path), so the old
          # 0.05/s threshold fired continuously for weeks and became wallpaper
          # (retuned 2026-08-22). 1/s is ~5x baseline and still catches the
          # trust-anchor-breakage class, which is orders of magnitude larger.
          expr: |-
            sum by (instance) (
              rate({__name__=~"pdns_recursor_dnssec_result_bogus.*",job="pdns-recursor"}[5m])
            ) > 1
          for: 5m
          keep_firing_for: 10m
          annotations:
            summary: "DNSSEC validation failures (bogus) increasing on {{ $labels.instance }}"
            description: |-
              PowerDNS Recursor on {{ $labels.instance }} is recording {{ $value | humanize }} bogus
              DNSSEC validations/s (5m rate). Bogus results return SERVFAIL with EDE 12 to clients.
              Likely cause: a DNSSEC trust-anchor gap, expired/invalid RRSIGs upstream, or a
              missing/stale root key. This is the precise silent signal behind the 2026-06-10
              guest/IoT reverse-PTR outage. Check the recursor root trust anchor and
              rec_control current-queries / dump-trace.
          labels:
            severity: critical
            component: dns

        # --- Recursor upstream latency / outgoing trouble ---
        - alert: RecursorClientLatencyHigh
          # True recent average client-answer latency = rate(sum)/rate(count) on
          # the cumul_clientanswers_seconds histogram, in SECONDS. Healthy floor
          # is ~16-28ms (upstream DoH). The raw pdns_recursor_qa_latency gauge is
          # a lifetime average dominated by cache hits (~1ms) and is NOT used here.
          # >150ms sustained 10m indicates real upstream trouble.
          expr: |-
            (
              rate(pdns_recursor_cumul_clientanswers_seconds_sum{job="pdns-recursor"}[10m])
              /
              clamp_min(rate(pdns_recursor_cumul_clientanswers_seconds_count{job="pdns-recursor"}[10m]), 1)
            ) > 0.15
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "Recursor client-answer latency high on {{ $labels.instance }}"
            description: |-
              Average client-answer latency on {{ $labels.instance }} is {{ $value | humanize }}s over 10m
              (healthy floor ~16-28ms). Upstream DoH may be slow or failing, or the recursor is
              spending time on retries/timeouts. Check RecursorOutgoingTimeoutsHigh and dnscrypt
              upstream response time.
          labels:
            severity: warning
            component: dns

        - alert: RecursorOutgoingTimeoutsHigh
          # pdns_recursor_outgoing_timeouts: upstream/auth queries that timed out.
          # Baseline ~0/s. Rising timeouts often precede SERVFAILs and high latency.
          expr: |-
            rate(pdns_recursor_outgoing_timeouts{job="pdns-recursor"}[5m]) > 1
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "Recursor outgoing query timeouts rising on {{ $labels.instance }}"
            description: |-
              PowerDNS Recursor on {{ $labels.instance }} is timing out on {{ $value | humanize }} outgoing
              queries/s (5m rate). Upstream resolvers (DoH via dnscrypt-proxy or authoritatives)
              may be unreachable or slow. Often a precursor to SERVFAILs and elevated latency.
          labels:
            severity: warning
            component: dns

        # --- dnsdist -> recursor backend path health ---
        - alert: DnsdistBackendDown
          # dnsdist_server_status == 0 means dnsdist marked a recursor backend
          # DOWN. The `server` label is local-recursor / remote-recursor-dnsN.
          # If a node's local recursor dies, dnsdist fails over to the remote,
          # but the DOWN backend still needs attention.
          expr: |-
            dnsdist_server_status{job="dnsdist"} == 0
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "dnsdist backend {{ $labels.server }} is DOWN on {{ $labels.instance }}"
            description: |-
              dnsdist on {{ $labels.instance }} has marked recursor backend "{{ $labels.server }}"
              ({{ $labels.address }}) as DOWN. The dnsdist->recursor path for that backend is failing
              its health check. Resolution continues via the surviving backend, but redundancy is lost.
              Investigate the recursor process / port 5301 on the affected node.
          labels:
            severity: warning
            component: dns

        - alert: DnsdistAllBackendsDown
          # All dnsdist backends on a node down at once = that node's dnsdist can
          # serve nothing from the recursor tier. Critical.
          expr: |-
            sum by (instance) (dnsdist_server_status{job="dnsdist"}) == 0
          for: 1m
          keep_firing_for: 5m
          annotations:
            summary: "All dnsdist recursor backends DOWN on {{ $labels.instance }}"
            description: |-
              Every recursor backend behind dnsdist on {{ $labels.instance }} is DOWN. This node's
              dnsdist cannot resolve anything via the recursor tier. If this is the VIP master, all
              clients are affected. Immediate action required.
          labels:
            severity: critical
            component: dns

        # --- Scrape-target liveness: a dead exporter/service caught directly ---
        - alert: DNSResolverTargetDown
          # up==0 for any DNS-stack scrape target (dnsdist/recursor/auth/dnscrypt)
          # means either the exporter or the service itself is dead — a silent
          # failure mode that probe-on-port-53 alone may miss.
          expr: |-
            up{job=~"dnsdist|pdns-recursor|pdns-auth|dnscrypt-proxy"} == 0
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "DNS scrape target {{ $labels.job }} down on {{ $labels.instance }}"
            description: |-
              Prometheus scrape of {{ $labels.job }} on {{ $labels.instance }} has been failing (up==0)
              for 5m. The exporter or the underlying DNS service ({{ $labels.job }}) may be dead.
              If both nodes show the same job down, resolution for that component is fully offline.
          labels:
            severity: warning
            component: dns

        - alert: DNSResolverComponentAllDown
          # Same component down on BOTH nodes = no redundancy left for that tier.
          expr: |-
            count by (job) (up{job=~"dnsdist|pdns-recursor|pdns-auth|dnscrypt-proxy"} == 0) >= 2
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "DNS component {{ $labels.job }} is down on ALL nodes"
            description: |-
              {{ $labels.job }} is down (up==0) on both dns0 and dns1. That entire tier of the
              resolver stack is offline cluster-wide. Immediate action required.
          labels:
            severity: critical
            component: dns

        # --- dnscrypt-proxy upstream (DoH) health ---
        - alert: DnscryptUpstreamLatencyHigh
          # dnscrypt_proxy_server_response_time_average_ms is the per-upstream
          # (server="cf-gateway") DoH response time. Healthy ~33-38ms. There is NO
          # explicit upstream-error counter in dnscrypt-proxy 2.1.15, so sustained
          # high response time is the best available proxy for upstream trouble.
          expr: |-
            dnscrypt_proxy_server_response_time_average_ms{job="dnscrypt-proxy"} > 250
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "dnscrypt-proxy upstream {{ $labels.server }} slow on {{ $labels.instance }}"
            description: |-
              dnscrypt-proxy on {{ $labels.instance }} reports {{ $value | humanize }}ms average response
              time from upstream "{{ $labels.server }}" (healthy ~33-38ms). The upstream DoH resolver
              may be degraded; this feeds recursor latency and can cascade into outgoing timeouts and
              SERVFAILs. NOTE: dnscrypt-proxy 2.1.15 has no upstream-error counter, so latency is the
              only observable upstream-health signal (see report for the exporter gap).
          labels:
            severity: warning
            component: dns

    # WAN / Gateway Alerts
    - name: wan-gateway.rules
      interval: 30s
      rules:
        - alert: GatewayNodeDown
          # 2026-06-26: selector was instance=~"10.255.255.254.*" which matched
          # ZERO series — the node-exporter instance label is the scrape target
          # hostname (gateway0.<domain>:9100), not the WAN IP, so this critical
          # alert could never fire. Fixed to instance=~"gateway0.*" (verified live).
          expr: |-
            up{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "Primary gateway (gateway0) node exporter is unreachable"
            description: |-
              Node exporter on gateway0 (10.255.255.254:9100) has been unreachable for over 5 minutes.
              Gateway0 may be down. Traffic should fail over to gateway1 via BGP.
          labels:
            severity: critical
            component: gateway

        - alert: GatewayWANInterfaceDown
          # 2026-06-26: same dead-selector bug as GatewayNodeDown — fixed
          # instance=~"10.255.255.254.*" -> instance=~"gateway0.*" (verified live).
          expr: |-
            node_network_carrier{instance=~"gateway0.*",device="eth0"} == 0
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "Primary WAN interface (eth0) on gateway0 is down"
            description: |-
              The Frontier fiber WAN interface on gateway0 has lost carrier for over 2 minutes.
              BGP should withdraw the default route and traffic will fail over to cellular (gateway1).
          labels:
            severity: critical
            component: gateway

        # --- gateway0 conntrack health (added 2026-06-26 holistic network review) ---
        # gateway0's conntrack table is huge (1,048,576) and normally ~0.1% used.
        # Live baselines: insert_failed ~0.01/s (~3/5m), invalid ~0.25/s (~75/5m) —
        # both are benign multi-CPU insert races amplified by 3x10G ECMP, NOT a fault.
        # Thresholds are set >>baseline so they fire only on a real excursion (new ECMP
        # asymmetry, state regression, table pressure). Metric names verified live:
        # node_nf_conntrack_stat_* have NO _total suffix. Tune if chatty.
        - alert: GatewayConntrackInsertFailSpike
          expr: |-
            increase(node_nf_conntrack_stat_insert_failed{job="node-exporter",instance=~"gateway0.*"}[5m]) > 200
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "gateway0 conntrack insert failures spiking"
            description: |-
              gateway0 logged {{ $value | humanize }} conntrack insert failures in 5m (baseline ~3/5m).
              A sustained spike points to new ECMP-path asymmetry or conntrack pressure rather than the
              benign steady-state race. Check ECMP next-hop health on gateway0/SC01 and table fill
              (see GatewayConntrackTableNearFull).
          labels:
            severity: warning
            component: gateway

        - alert: GatewayConntrackInvalidSpike
          expr: |-
            increase(node_nf_conntrack_stat_invalid{job="node-exporter",instance=~"gateway0.*"}[5m]) > 1000
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "gateway0 conntrack invalid-packet rate spiking"
            description: |-
              gateway0 logged {{ $value | humanize }} invalid-state conntrack packets in 5m (baseline ~75/5m).
              Sustained growth indicates asymmetric/ECMP forwarding seeing out-of-state packets, a firewall
              state regression, or a routing loop. Benign at baseline; investigate only on excursion.
          labels:
            severity: warning
            component: gateway

        - alert: GatewayConntrackTableNearFull
          expr: |-
            node_nf_conntrack_entries{job="node-exporter",instance=~"gateway0.*"}
            /
            node_nf_conntrack_entries_limit{job="node-exporter",instance=~"gateway0.*"}
            > 0.8
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "gateway0 conntrack table over 80% full"
            description: |-
              gateway0 conntrack table is {{ $value | humanizePercentage }} full (limit 1,048,576;
              normal ~0.1%). Above 80%, new connections risk being dropped (insert_fail/ENOMEM).
              Investigate a connection flood, scan, or leak before the table fills.
          labels:
            severity: warning
            component: gateway

        # --- gateway0 NIC physical-layer health (added 2026-06-26; fed by the VyOS-native
        # node_exporter textfile collector + /config/scripts/ethtool-textfile.sh, which emits
        # node_ethtool_stats_total{device,type} for the mlx5 NICs). The lane-error counters
        # are normally FROZEN (eth0 ~1082, FEC-corrected historical optic bits) and the
        # buffer-drop counters are normally exactly 0 — so sustained growth is a real fault
        # (degrading optic/DAC, or NIC ring/buffer starvation). The native ethtool collector
        # isn't available on VyOS, hence the textfile shim that mirrors its metric shape.
        - alert: GatewayNICPhysicalErrors
          expr: |-
            increase(node_ethtool_stats_total{job="node-exporter",instance=~"gateway0.*",type=~"rx_err_lane_[0-3]_phy|rx_crc_errors_phy|rx_symbol_err_phy"}[30m]) > 100
          for: 10m
          keep_firing_for: 15m
          annotations:
            summary: "gateway0 NIC physical errors climbing on {{ $labels.device }}"
            description: |-
              {{ $labels.device }} logged {{ $value | humanize }} new {{ $labels.type }} in 30m
              (these counters are normally frozen — FEC-corrected historical optic bits). Sustained
              growth indicates a degrading optic/fiber (eth0 = WAN) or DAC/cable to SC01 (eth1-3).
              Check the SFP/optic and link error counters before it becomes packet loss.
          labels:
            severity: warning
            component: gateway

        - alert: GatewayNICRxBufferDrops
          expr: |-
            increase(node_ethtool_stats_total{job="node-exporter",instance=~"gateway0.*",type=~"rx_discards_phy|rx_out_of_buffer|rx_buff_alloc_err"}[15m]) > 10
          for: 5m
          keep_firing_for: 10m
          annotations:
            summary: "gateway0 NIC dropping rx frames (buffer starvation) on {{ $labels.device }}"
            description: |-
              {{ $labels.device }} logged {{ $value | humanize }} {{ $labels.type }} in 15m
              (normally exactly 0). The NIC is discarding received frames — ring/buffer exhaustion or
              the host can't drain fast enough. This is real ingress loss; check softirq/CPU, ring
              sizes, and offload, and correlate with throughput on that interface.
          labels:
            severity: warning
            component: gateway

        - alert: PrimaryWANDown
          expr: |-
            count(probe_success{job=~"gateway-wan.*"} == 0) >= 5
          for: 3m
          keep_firing_for: 5m
          annotations:
            summary: "Primary WAN (Frontier fiber) has lost internet reachability"
            description: |-
              {{ $value }} of 7 multi-protocol probes (ICMP/HTTP/TCP) from gateway0 are failing.
              Frontier fiber link may be up but ISP routing is broken.
              Traffic should fail over to cellular (gateway1) via BGP.
          labels:
            severity: critical
            component: gateway

        - alert: PrimaryWANDegraded
          expr: |-
            count(probe_success{job=~"gateway-wan.*"} == 0) >= 2
            and
            count(probe_success{job=~"gateway-wan.*"} == 0) < 5
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "Primary WAN has partial reachability loss"
            description: |-
              {{ $value }} of 7 multi-protocol probes from gateway0 are failing.
              Frontier fiber may have partial routing issues.
          labels:
            severity: warning
            component: gateway

        # --- wan-health daemon live textfile metrics (added 2026-08-12 review fix).
        # The daemon on gateway0 refreshes /run/node_exporter/collector/wan_health.prom
        # every ~5s loop (verified live in VMSingle: wan_health_withdrawn,
        # wan_health_fail_count, wan_health_suppress_streak_seconds,
        # wan_health_last_rx_mbps, wan_health_last_run_timestamp_seconds; all on
        # instance gateway0.<domain>:9100). This is the FAST path — the pre-existing
        # WANHealthWithdrawn in vmrule-snmp-geoip.yaml rides an SNMP extend that
        # refreshes ~15min and misses short withdraw/restore events entirely.
        - alert: WANHealthWithdrawnLive
          expr: |-
            wan_health_withdrawn{job="node-exporter",instance=~"gateway0.*"} == 1
          for: 0m
          keep_firing_for: 10m
          annotations:
            summary: "wan-health has withdrawn the BGP default on gateway0 (live signal)"
            description: |-
              The wan-health daemon on gateway0 is reporting wan_health_withdrawn=1: it has
              withdrawn BGP default-route origination because its WAN checks failed. Traffic is
              failing over to cellular per design. This live textfile signal refreshes every ~5s
              and catches short events the 15-min SNMP-based WANHealthWithdrawn (slow path,
              vmrule-snmp-geoip.yaml) sleeps through. Check wan_health_fail_count and
              wan_health_last_rx_mbps for why.
          labels:
            severity: critical
            component: gateway

        - alert: WANHealthDaemonStale
          # Same served-stale-file trap as WGTunnelHealthStale: a dead daemon's
          # last .prom keeps being scraped forever, so absent() never fires and
          # wan_health_withdrawn freezes at its last value. A dead wan-health
          # daemon means NOTHING guards BGP default origination against a broken
          # WAN — failover simply won't happen. Healthy lag is loop (~5s) +
          # scrape interval (~30s); >60s sustained 2m is a dead/wedged daemon.
          expr: |-
            time() - wan_health_last_run_timestamp_seconds{job="node-exporter",instance=~"gateway0.*"} > 60
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "wan-health daemon stale on gateway0 ({{ $value | humanize }}s since last run)"
            description: |-
              wan_health_last_run_timestamp_seconds on gateway0 is {{ $value | humanize }}s old
              (daemon loop runs every ~5s). The wan-health daemon is dead or wedged: the BGP
              default route is now UNGUARDED — a WAN failure will not trigger withdrawal/failover
              until this is fixed. Restart the daemon on gateway0 and check
              /run/node_exporter/collector/wan_health.prom.
          labels:
            severity: critical
            component: gateway

        - alert: WANHealthSuppressionActive
          # Informational: the congestion guard saw probe failures but rx-throughput
          # (wan_health_last_rx_mbps) proved the link was still delivering, so it
          # SUPPRESSED withdrawal instead of failing the house to cellular. That is
          # the guard working as designed — but it is also a congestion near-miss
          # worth seeing, and long/repeated streaks mean the WAN is regularly
          # saturated enough to fail probes.
          expr: |-
            wan_health_suppress_streak_seconds{job="node-exporter",instance=~"gateway0.*"} > 0
          for: 0m
          keep_firing_for: 10m
          annotations:
            summary: "wan-health congestion guard active on gateway0 ({{ $value | humanize }}s streak)"
            description: |-
              wan-health probes on gateway0 are failing but the congestion guard is suppressing
              BGP withdrawal because the link is still moving traffic
              (streak {{ $value | humanize }}s). No failover occurred — working as designed — but
              this is a congestion near-miss: something is saturating the WAN hard enough to fail
              probes. Correlate with throughput and identify the flow if streaks recur.
          labels:
            severity: warning
            component: gateway

        - alert: BackupGatewayDown
          expr: |-
            probe_success{job="probe/observability/devices",instance=~"gateway1.*"} == 0
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "Backup gateway (gateway1) is unreachable"
            description: |-
              ICMP probe to gateway1 (ISR 4321) has been failing for over 10 minutes.
              Cellular WAN backup is unavailable. Primary fiber (gateway0) is the only internet path.
          labels:
            severity: warning
            component: gateway

        - alert: CellularWANDown
          expr: |-
            (count(probe_success{job=~"cgw0-wan.*"} == 0) >= 5)
            and
            (count(probe_success{job=~"cgw1-wan.*"} == 0) >= 5)
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "Both cellular WANs have lost internet reachability"
            description: |-
              Multi-protocol probes (ICMP/HTTP/TCP) from both cell-gateway0 and cell-gateway1 are failing.
              Cellular backup internet is completely unavailable.
          labels:
            severity: warning
            component: gateway

        - alert: CellularWAN1Down
          expr: |-
            count(probe_success{job=~"cgw0-wan.*"} == 0) >= 5
          for: 90s
          keep_firing_for: 5m
          annotations:
            summary: "Cellular WAN 1 (cell-gateway0) has lost internet reachability"
            description: |-
              {{ $value }} of 7 multi-protocol probes from cell-gateway0 (T-Mobile modem #1) are failing.
              Cell-gateway1 may still be providing backup connectivity.
          labels:
            severity: warning
            component: gateway

        - alert: CellularWAN2Down
          expr: |-
            count(probe_success{job=~"cgw1-wan.*"} == 0) >= 5
          for: 90s
          keep_firing_for: 5m
          annotations:
            summary: "Cellular WAN 2 (cell-gateway1) has lost internet reachability"
            description: |-
              {{ $value }} of 7 multi-protocol probes from cell-gateway1 (T-Mobile modem #2) are failing.
              Cell-gateway0 may still be providing backup connectivity.
          labels:
            severity: warning
            component: gateway

    # VLAN90 WireGuard tunnel health (added 2026-08-12, gateway0 VPN audit follow-up).
    # Metrics come from the wg-tunnel-health daemon on gateway0, which writes
    # node-exporter textfile metrics every 10s (instance gateway0.<domain>:9100,
    # all metric names verified live against Victoria Metrics):
    #   wg_tunnel_ping_healthy{tunnel="wg0|wg1|wg2"}     1/0 in-tunnel probe state
    #                                                    (hysteresis applied on-box)
    #   wg_tunnel_handshake_age_seconds{tunnel}          latest-handshake age (-1 = never)
    #   wg_tunnel_ecmp_active{tunnel}                    1/0 leg present in ECMP table 92
    #                                                    (daemon auto-withdraws dead legs)
    #   vlan90_leak_packets_total / vlan90_leak_packets6_total
    #     Counters of VLAN90 packets DROPPED by the fail-closed VPN→WAN guard.
    #     Gauge-read from nft, so they reset on reboot/daemon restart — always
    #     use increase(), which tolerates resets.
    - name: wg-tunnel.rules
      interval: 30s
      rules:
        - alert: WGTunnelLegDown
          # In-tunnel probe failed. The daemon applies hysteresis on-box before
          # flipping this to 0, so 2m of sustained 0 is a real dead leg. The
          # daemon should auto-withdraw it from ECMP (see WGTunnelLegWithdrawn).
          expr: |-
            wg_tunnel_ping_healthy{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "WireGuard tunnel {{ $labels.tunnel }} in-tunnel probe failing"
            description: |-
              The in-tunnel health probe for {{ $labels.tunnel }} on gateway0 has been failing
              for 2m (hysteresis already applied on-box). The wg-tunnel-health daemon should
              auto-withdraw this leg from ECMP table 92. VLAN90 egress continues on the
              surviving legs; check the AirVPN endpoint / handshake for this tunnel.
          labels:
            severity: warning
            component: gateway

        - alert: WGTunnelLegWithdrawn
          # Info-level noise guard: the daemon withdraws/restores legs automatically
          # during endpoint blips, so only alert if a leg stays out for 5m.
          expr: |-
            wg_tunnel_ecmp_active{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "WireGuard tunnel {{ $labels.tunnel }} withdrawn from ECMP for 5m+"
            description: |-
              {{ $labels.tunnel }} has been absent from ECMP table 92 on gateway0 for over 5m.
              Short withdrawals are normal self-healing; a persistent one means the leg is not
              recovering (dead peer, endpoint unreachable, or daemon stuck). VLAN90 capacity
              and flow-spread are reduced until it returns.
          labels:
            severity: warning
            component: gateway

        - alert: WGTunnelECMPDegraded
          expr: |-
            sum(wg_tunnel_ecmp_active{job="node-exporter",instance=~"gateway0.*"}) < 3
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "VLAN90 ECMP running degraded ({{ $value }}/3 tunnel legs active)"
            description: |-
              Only {{ $value }} of 3 WireGuard legs are present in ECMP table 92 on gateway0
              for 10m+. VLAN90 egress still works but with reduced capacity and redundancy.
              Check per-leg state via WGTunnelLegDown / WGTunnelLegWithdrawn.
          labels:
            severity: warning
            component: gateway

        - alert: WGTunnelECMPAllLegsDown
          # All legs withdrawn = ECMP table 92 empty. The VPN→WAN guard is
          # fail-closed, so VLAN90 is HARD DOWN (traffic dropped, not leaked).
          expr: |-
            sum(wg_tunnel_ecmp_active{job="node-exporter",instance=~"gateway0.*"}) < 1
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "All WireGuard ECMP legs down — VLAN90 egress is hard down (fail-closed)"
            description: |-
              Zero WireGuard legs remain in ECMP table 92 on gateway0. The fail-closed
              VPN→WAN guard is now dropping ALL VLAN90 egress (nothing leaks to the WAN,
              but VLAN90 has no internet). Check AirVPN reachability, gateway0 WAN health,
              and the wg-tunnel-health daemon.
          labels:
            severity: critical
            component: gateway

        - alert: WGHandshakeStale
          # WireGuard rekeys roughly every 2 minutes under traffic; a handshake
          # age >300s means the peer has gone silent — a failure mode the
          # in-tunnel ping can miss if it rides a cached/stale path. -1 (never
          # handshaken) intentionally does not match; a never-up leg is caught
          # by WGTunnelLegDown.
          expr: |-
            wg_tunnel_handshake_age_seconds{job="node-exporter",instance=~"gateway0.*"} > 300
          for: 5m
          keep_firing_for: 5m
          annotations:
            summary: "WireGuard handshake stale on {{ $labels.tunnel }} ({{ $value | humanize }}s old)"
            description: |-
              Latest WireGuard handshake on {{ $labels.tunnel }} (gateway0) is {{ $value | humanize }}s
              old (healthy under traffic: ~120s max). The peer has gone silent — dead AirVPN
              endpoint or broken UDP path — even if the in-tunnel probe still looks alive.
          labels:
            severity: warning
            component: gateway

        - alert: VLAN90LeakAttempt
          # ANY increase means a VLAN90 packet tried to egress the WAN un-tunneled
          # and was DROPPED by the fail-closed guard. Nothing leaked — but something
          # is misrouted (policy-routing regression, tunnel-bypass bug, or a host
          # doing something it shouldn't), so it pages immediately.
          expr: |-
            increase(vlan90_leak_packets_total{job="node-exporter",instance=~"gateway0.*"}[5m]) > 0
          for: 0m
          keep_firing_for: 15m
          annotations:
            summary: "VLAN90 IPv4 leak attempt blocked ({{ $value | humanize }} pkts dropped in 5m)"
            description: |-
              The fail-closed VPN→WAN guard on gateway0 dropped {{ $value | humanize }} VLAN90 IPv4
              packets in 5m that tried to egress the WAN outside the WireGuard tunnels. No traffic
              leaked — the guard did its job — but VLAN90 traffic should NEVER reach the WAN path
              un-tunneled. Investigate policy routing / ECMP table 92 on gateway0 and identify the
              source flows before assuming it is benign.
          labels:
            severity: critical
            component: security

        - alert: VLAN90LeakAttemptIPv6
          expr: |-
            increase(vlan90_leak_packets6_total{job="node-exporter",instance=~"gateway0.*"}[5m]) > 0
          for: 0m
          keep_firing_for: 15m
          annotations:
            summary: "VLAN90 IPv6 leak attempt blocked ({{ $value | humanize }} pkts dropped in 5m)"
            description: |-
              The fail-closed VPN→WAN guard on gateway0 dropped {{ $value | humanize }} VLAN90 IPv6
              packets in 5m that tried to egress the WAN outside the WireGuard tunnels. No traffic
              leaked, but nothing on VLAN90 should ever hit the WAN path un-tunneled. Investigate
              IPv6 policy routing on gateway0 and identify the source flows.
          labels:
            severity: critical
            component: security

        - alert: WGTunnelHealthStale
          # 2026-08-12 review fix: the old absent()-based rule could NEVER catch a
          # dead daemon — node_exporter keeps serving the last-written .prom file
          # forever, so the series never goes absent while the values silently
          # freeze. The daemon stamps wg_tunnel_health_last_run_timestamp_seconds
          # on every loop (~10s); a stale stamp is the real dead-daemon signal.
          # Healthy observed lag = loop period + scrape interval (~40s max), so
          # >90s sustained 2m is a genuinely stuck/dead daemon and every other
          # rule in this group is silently frozen at its last value.
          expr: |-
            time() - wg_tunnel_health_last_run_timestamp_seconds{job="node-exporter",instance=~"gateway0.*"} > 90
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "wg-tunnel-health daemon stale — tunnel metrics frozen ({{ $value | humanize }}s old)"
            description: |-
              wg_tunnel_health_last_run_timestamp_seconds on gateway0 is {{ $value | humanize }}s old
              (daemon loop writes every ~10s). The wg-tunnel-health daemon has died or wedged, and
              node-exporter is still serving its LAST textfile snapshot — all wg-tunnel.rules alerts
              are frozen at stale values, not absent. Restart the daemon on gateway0 and check
              /run/node_exporter/collector/wg_tunnel_health.prom.
          labels:
            severity: warning
            component: gateway

        - alert: WGTunnelMetricsAbsent
          # Scrape-loss catch-all, complementary to WGTunnelHealthStale: if the
          # .prom file itself is deleted or the textfile collector/scrape config
          # regresses, the series vanish entirely and time()-based staleness math
          # returns no result — so a separate absent() check is still required to
          # avoid going blind. (Whole-exporter death also raises GatewayNodeDown.)
          expr: |-
            absent(wg_tunnel_health_last_run_timestamp_seconds{job="node-exporter",instance=~"gateway0.*"})
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "WireGuard tunnel-health metrics missing — tunnel monitoring is blind"
            description: |-
              wg_tunnel_health_last_run_timestamp_seconds has been absent from gateway0's
              node-exporter scrape for 10m. The textfile output was removed or the textfile
              collector / scrape config regressed (a dead-but-file-still-served daemon is caught
              earlier by WGTunnelHealthStale). All wg-tunnel.rules alerts are inert until fixed.
          labels:
            severity: warning
            component: gateway

        - alert: WGSteeringDrift
          # wg_steering_ok verifies per-tunnel steering wiring (fwmark/RSS-queue
          # isolation + policy-route plumbing) is exactly as designed. A silent
          # steering regression — tunnels up, traffic riding the wrong path — is
          # the exact failure class behind the original single-core UDP-overload
          # WAN blackouts, so drift pages even though traffic still flows.
          expr: |-
            wg_steering_ok{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 5m
          keep_firing_for: 10m
          annotations:
            summary: "WireGuard steering drift on {{ $labels.tunnel }} — tunnel isolation regressed"
            description: |-
              wg_steering_ok for {{ $labels.tunnel }} on gateway0 has reported 0 for 5m: the
              per-tunnel steering (RSS-queue isolation / policy routing) no longer matches the
              designed layout. Traffic still flows, which is exactly why this class of regression
              stayed invisible before — it re-concentrates tunnel UDP onto shared paths and
              re-creates the single-core-overload WAN blackout conditions under load. Fix the
              steering before the next heavy transfer, do not wait for symptoms.
          labels:
            severity: critical
            component: gateway

        - alert: WGRouteMismatch
          # The daemon bumps wg_tunnel_route_mismatch_total whenever it observes
          # a tunnel route diverging from the expected table-92 layout (it also
          # self-heals). Counter is normally frozen at 0 — any increase means
          # something is fighting the routing config and deserves a look even
          # though the daemon repaired it.
          expr: |-
            increase(wg_tunnel_route_mismatch_total{job="node-exporter",instance=~"gateway0.*"}[10m]) > 0
          for: 0m
          keep_firing_for: 15m
          annotations:
            summary: "WireGuard route mismatch detected on {{ $labels.tunnel }} ({{ $value | humanize }} in 10m)"
            description: |-
              wg_tunnel_route_mismatch_total for {{ $labels.tunnel }} on gateway0 increased by
              {{ $value | humanize }} in 10m (normally frozen at 0). The tunnel-health daemon found
              the live routing state diverging from the expected ECMP/table-92 layout and corrected
              it. Repeated mismatches mean another actor (commit hook, script, manual change) is
              fighting the routing config — find it before it wins a race the daemon loses.
          labels:
            severity: warning
            component: gateway

    # IPv6 (HE 6in4) tunnel health (added 2026-08-13, gateway0 hardening review).
    # Metrics come from the v6-tunnel-health daemon on gateway0, which writes
    # node-exporter textfile metrics on every loop (instance gateway0.<domain>:9100,
    # all metric names verified live against Victoria Metrics before commit):
    #   v6tun_healthy                    1/0 tun0 path to the v6 internet reachable
    #                                    (hysteresis applied on-box)
    #   v6tun_default_originated         1/0 gateway0 is advertising the v6 ::/0
    #                                    default to SC01; the daemon WITHDRAWS it when
    #                                    tun0 is dead so clients fall back to v4
    #   v6tun_far_handshake_ok           1/0 HE tunnel far side
    #                                    (2001:470:1f10:176::1) reachable
    #   v6tun_probe_rtt_ms               probe RTT in ms (-1 when failing) — no alert,
    #                                    a failing probe already flips v6tun_healthy
    #   v6tun_last_run_timestamp_seconds daemon heartbeat (staleness signal)
    - name: v6-tunnel.rules
      interval: 30s
      rules:
        - alert: V6TunnelDown
          # tun0 v6 path is dead. The daemon applies hysteresis on-box before
          # flipping this to 0, so 2m of sustained 0 is a real outage. The daemon
          # withdraws the ::/0 default in response (see V6DefaultWithdrawn), so
          # clients fall back to IPv4 — no hard outage, hence warning.
          expr: |-
            v6tun_healthy{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "IPv6 tunnel down on gateway0 — tun0 v6 path unreachable (clients on v4)"
            description: |-
              v6tun_healthy on gateway0 has reported 0 for 2m (hysteresis already applied on-box):
              the tun0 path to the IPv6 internet is unreachable. The v6-tunnel-health daemon
              withdraws the ::/0 default to SC01 so clients fall back to IPv4 — no hard outage, but
              IPv6 is down. Check the HE 6in4 tunnel (see V6TunnelFarSideDown) and tun0 on gateway0.
          labels:
            severity: warning
            component: gateway

        - alert: V6DefaultWithdrawn
          # Companion to V6TunnelDown: confirms the daemon actually pulled the v6
          # ::/0 default from SC01 (the fall-back-to-v4 mechanism). Normally fires
          # alongside V6TunnelDown; a divergence between the two means the withdraw
          # logic itself is misbehaving (default still advertised over a dead tun0,
          # or withdrawn while healthy).
          expr: |-
            v6tun_default_originated{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "IPv6 ::/0 default withdrawn on gateway0 — clients falling back to v4"
            description: |-
              v6tun_default_originated on gateway0 has been 0 for 2m: gateway0 is no longer
              advertising the IPv6 ::/0 default to SC01, so clients fall back to IPv4. This is the
              expected reaction to a dead tun0 (see V6TunnelDown) — informational. If it fires
              WITHOUT V6TunnelDown, the withdraw logic diverged from the tunnel state; investigate.
          labels:
            severity: warning
            component: gateway

        - alert: V6TunnelFarSideDown
          # Narrows a v6 outage to the HE broker/tunnel endpoint specifically: the
          # far-side handshake (2001:470:1f10:176::1) is unreachable while the rest
          # of the path may be fine. Slightly longer 3m window than V6TunnelDown to
          # ride out HE-side blips before pointing the finger at the broker.
          expr: |-
            v6tun_far_handshake_ok{job="node-exporter",instance=~"gateway0.*"} == 0
          for: 3m
          keep_firing_for: 5m
          annotations:
            summary: "IPv6 HE tunnel far side unreachable from gateway0"
            description: |-
              v6tun_far_handshake_ok on gateway0 has been 0 for 3m: the Hurricane Electric 6in4
              tunnel far-side endpoint (2001:470:1f10:176::1) is unreachable. This isolates the v6
              outage to the HE broker / tunnel endpoint rather than local tun0 or routing. Check HE
              tunnelbroker status and the gateway0 WAN path to the HE PoP.
          labels:
            severity: warning
            component: gateway

        - alert: V6TunnelHealthStale
          # Same served-stale-file trap as WGTunnelHealthStale / WANHealthDaemonStale:
          # node-exporter keeps serving the last-written .prom forever, so absent()
          # never fires and every v6tun_* gauge silently FREEZES at its last value —
          # we'd go blind to a tunnel failure while the daemon is dead. The daemon
          # stamps v6tun_last_run_timestamp_seconds each loop; healthy observed lag is
          # loop period + scrape interval (~40s), so >90s sustained 2m is a dead daemon.
          expr: |-
            time() - v6tun_last_run_timestamp_seconds{job="node-exporter",instance=~"gateway0.*"} > 90
          for: 2m
          keep_firing_for: 5m
          annotations:
            summary: "v6-tunnel-health daemon stale — v6 tunnel metrics frozen ({{ $value | humanize }}s old)"
            description: |-
              v6tun_last_run_timestamp_seconds on gateway0 is {{ $value | humanize }}s old. The
              v6-tunnel-health daemon has died or wedged and node-exporter is still serving its LAST
              textfile snapshot — every v6-tunnel.rules alert is frozen at stale values, not absent,
              so a real tunnel failure would go unseen. Restart the daemon on gateway0 and check
              /run/node_exporter/collector/v6tun_health.prom.
          labels:
            severity: warning
            component: gateway

        - alert: V6TunnelMetricsAbsent
          # Scrape-loss catch-all complementary to V6TunnelHealthStale (matching the
          # WGTunnelMetricsAbsent pattern): if the .prom file is deleted or the
          # textfile collector / scrape config regresses, the series vanish entirely
          # and the time()-based staleness math returns no result — a separate absent()
          # check is required to avoid going blind. Whole-exporter death is caught by
          # GatewayNodeDown; this fires for the file-deleted / partial-scrape case.
          expr: |-
            absent(v6tun_last_run_timestamp_seconds{job="node-exporter",instance=~"gateway0.*"})
          for: 10m
          keep_firing_for: 5m
          annotations:
            summary: "IPv6 tunnel-health metrics missing — v6 tunnel monitoring is blind"
            description: |-
              v6tun_last_run_timestamp_seconds has been absent from gateway0's node-exporter scrape
              for 10m. The textfile output was removed or the textfile collector / scrape config
              regressed (a dead-but-file-still-served daemon is caught earlier by V6TunnelHealthStale).
              All v6-tunnel.rules alerts are inert until this is fixed.
          labels:
            severity: warning
            component: gateway
