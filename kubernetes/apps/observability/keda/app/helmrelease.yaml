---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  chartRef:
    kind: OCIRepository
    name: keda
  interval: 1h
  values:
    enableServiceLinks: false
    prometheus:
      operator:
        enabled: true
    operator:
      service:
        ports:
          metrics:
            port: 8080
          grpc:
            port: 9666
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 208Mi
        limits:
          cpu: null
          memory: 336Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: null
          memory: 192Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: null
          memory: 192Mi
