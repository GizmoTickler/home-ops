---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: devices
spec:
  module: icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - sc01.${SECRET_DOMAIN}
        - nas01.${SECRET_DOMAIN}
        - nas01-console.${SECRET_DOMAIN}
        - unifi.${SECRET_DOMAIN}
        - jellyfin.${SECRET_DOMAIN}
        - s3.${SECRET_DOMAIN}
        - edge0.${SECRET_DOMAIN}
        - edge1.${SECRET_DOMAIN}
        - dns0.${SECRET_DOMAIN}
        - dns1.${SECRET_DOMAIN}
        # UXG-Fiber, the internet edge since 2026-11-12 (SC01-Transit VLAN 3044 side;
        # its mgmt transit address 10.255.255.42 does not answer ICMP from the cluster).
        # gateway0 is a lab box now and is not probed.
        - 10.255.255.46
        - gateway1.${SECRET_DOMAIN}
        - mgateway1.${SECRET_DOMAIN}
        - cell-gateway0.${SECRET_DOMAIN}
        - cell-gateway1.${SECRET_DOMAIN}

---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nfs
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 192.168.120.10:2049

---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dns
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 192.168.123.250:53
        - 192.168.123.251:53
        # Anycast data plane — the ONLY resolver clients receive via DHCP option 6
        # since the 2026-08-22 cutover. Served by both nodes via BGP ECMP.
        - 10.53.53.53:53
