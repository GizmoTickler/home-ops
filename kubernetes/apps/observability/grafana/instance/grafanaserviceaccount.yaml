---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/grafana.integreatly.org/grafanaserviceaccount_v1beta1.json
# Read-only Grafana service account for Claude Code's Grafana MCP (claude-config infra/tools/mcp/grafana-mcp.sh).
# The operator recreates the account and token whenever Grafana's database is rebuilt; the PushSecret below
# copies the current token into 1Password (Infrastructure/grafana-claude-sa, field "token"), so the MCP always
# reads a valid token after reboots and cluster rebuilds.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: claude-mcp
spec:
  instanceName: grafana
  name: claude-mcp
  role: Viewer
  tokens:
    - name: claude-mcp
      secretName: grafana-claude-sa-token
