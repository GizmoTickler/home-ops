---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Keeps 1Password Infrastructure/grafana-claude-sa (field "token") equal to the operator-managed token.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-claude-sa
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-claude-sa-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: grafana-claude-sa
          property: token
