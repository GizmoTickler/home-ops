---
# yaml-language-server: $schema=https://kubernetes-schema.pages.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: smartctl-exporter
spec:
  groups:
    - name: disk-health.rules
      interval: 5m
      rules:
        # SMART attribute 199 is a monotonic lifetime counter that cannot be
        # reset, so the absolute value is meaningless -- some drives arrive
        # from a previous host with a non-zero baseline. Only an INCREASE
        # indicates a problem with the current cable/backplane slot.
        - alert: DiskUDMACRCErrorsIncreasing
          expr: |-
            smartctl_device_attribute{job="smartctl-exporter",attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}
              - min_over_time(smartctl_device_attribute{job="smartctl-exporter",attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}[6h])
              > 0
          for: 10m
          keep_firing_for: 30m
          annotations:
            summary: "SATA link CRC errors increasing on {{ $labels.instance }} disk {{ $labels.device }}"
            description: |-
              Disk {{ $labels.device }} on {{ $labels.instance }} has gained
              {{ $value }} new UDMA_CRC_Error_Count events in the last 6h.
              These are SATA/SAS link-layer CRC failures: the transfer is
              retried so data is not corrupted, but they indicate a marginal
              physical connection -- cable, backplane slot, or connector.
              Investigate the cable/slot rather than the drive; the NAND is
              almost certainly fine. Check whether the link has downshifted:
                smartctl -i /dev/<dev> | grep "SATA Version"
              MegaRAID devices are labelled bus_0_sat+megaraid_<DID>; map DID
              to a bay with:
                storcli /c0 /eall /sall show
            runbook_url: https://www.smartmontools.org/wiki/FAQ#ATACRCerrors
          labels:
            severity: warning
            component: storage
