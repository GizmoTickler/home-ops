# Shared Docker networks for nas01 apps (see truenas/README.md "Shared networks").
# Created by the reconciler before any app is reconciled; never changed or deleted by it.
networks:
  # app <-> app and Caddy -> app traffic. Apps join it as `apps: {external: true}` and are reached by service
  # name (service names must therefore be unique across apps). Caddy is 172.31.200.2 here and carries network
  # aliases for every hostname it serves, so apps resolve <host>.<domain> to Caddy without leaving the host.
  - name: apps
    driver: bridge
    subnet: 172.31.200.0/24
    gateway: 172.31.200.1
  # Monitoring stack only (VictoriaMetrics, vmalert, Alertmanager, Grafana, blackbox, gatus, kromgo) + Caddy
  # (172.31.201.254: top of the range, dynamic allocation starts at .2; same hostname aliases as on `apps`). VictoriaMetrics/Alertmanager have no auth of their own, so
  # they are deliberately NOT on `apps`; egress (scrapes/probes) is NATed via nas01.
  - name: monitoring
    driver: bridge
    subnet: 172.31.201.0/24
    gateway: 172.31.201.1
  # MGMT VLAN 999 presence for apps that need their own LAN IP (Caddy, qBittorrent/gluetun, Home Assistant).
  # One shared macvlan: Docker refuses a second network with an overlapping subnet. The host cannot reach its
  # macvlan children (and vice versa); containers that also sit on `apps` talk to them there.
  # Every IP used here needs an SC01 TrustSec sgt-map (SGT 15) -- see each app's compose header.
  - name: mgmt
    driver: macvlan
    parent: br0
    subnet: 192.168.120.0/22
    gateway: 192.168.123.254
