# IT-Tools — Handy developer/IT utilities (stateless)
# Listens: it-tools:8080 on the shared `apps` network; https://it-tools.<domain> via Caddy (Pocket ID forward-auth: oauth2-proxy service it-tools-auth).
# Data:    none (stateless)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  it-tools:
    image: ghcr.io/home-operations/it-tools:2024.10.22@sha256:7f26ae8d7a4a58b8d70b685cba5cbaa54d7df876d9f8bae702207f45b06d9b7c
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
    networks: [apps]
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1", memory: 192M}
    logging: *logging

  it-tools-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "it-tools"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/it-tools/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_it_tools"
      OAUTH2_PROXY_REDIRECT_URL: "https://it-tools.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  apps: {external: true}
