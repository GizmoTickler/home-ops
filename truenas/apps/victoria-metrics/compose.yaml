# VictoriaMetrics — single-node TSDB + scraper for the home network (replaces the k8s vmsingle + vmagent).
# Listens: victoria-metrics:8428 on the `monitoring` network; https://metrics.<domain> via Envoy (Pocket ID OAuth2).
# Data:    /mnt/flashstor/apps/victoria-metrics-data (history copied from the k8s vmsingle on 2026-11-12), 90 d.
# Scrape:  scrape.yaml (rendered by the reconciler; static jobs ported 1:1 from the k8s vmagent).
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    restart: unless-stopped
    environment:
      TZ: America/New_York
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -httpListenAddr=:8428
      - -promscrape.config=/etc/vm/scrape.yaml
      - -promscrape.configCheckInterval=30s
      - -dedup.minScrapeInterval=30s
      - -maxLabelsPerTimeseries=50
      - -search.maxConcurrentRequests=16
      - -search.maxQueueDuration=30s
      - -search.maxQueryDuration=120s
      - -search.maxMemoryPerQuery=536870912
      - -search.cacheTimestampOffset=5m
      - -search.maxUniqueTimeseries=300000
    networks: [monitoring]
    volumes:
      - /mnt/flashstor/apps/victoria-metrics-data:/storage
      - /mnt/flashstor/apps/victoria-metrics-config:/etc/vm:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 6144M}
    logging: *logging

networks:
  monitoring: {external: true}   # monitoring stack network (truenas/networks.yaml), Caddy is its ingress
