# VictoriaMetrics — single-node TSDB + scraper for the home network (replaces the k8s vmsingle + vmagent).
# Listens: victoria-metrics:8428 on the `monitoring` network; https://metrics.<domain> via Caddy (Pocket ID forward-auth: oauth2-proxy service victoria-metrics-auth).
# Data:    /mnt/flashstor/apps/victoria-metrics-data (history copied from the k8s vmsingle on 2026-11-12), 90 d.
# Scrape:  scrape.yaml (rendered by the reconciler; static jobs ported 1:1 from the k8s vmagent).
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    restart: unless-stopped
    environment:
      TZ: America/New_York
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -httpListenAddr=:8428
      - -promscrape.config=/etc/vm/scrape.yaml
      - -promscrape.configCheckInterval=30s
      - -dedup.minScrapeInterval=30s
      - -maxLabelsPerTimeseries=50
      - -search.maxConcurrentRequests=16
      - -search.maxQueueDuration=30s
      - -search.maxQueryDuration=120s
      - -search.maxMemoryPerQuery=536870912
      - -search.cacheTimestampOffset=5m
      - -search.maxUniqueTimeseries=300000
    networks: [monitoring]
    volumes:
      - /mnt/flashstor/apps/victoria-metrics-data:/storage
      - /mnt/flashstor/apps/victoria-metrics-config:/etc/vm:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 6144M}
    logging: *logging

  victoria-metrics-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: America/New_York
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: vmauth            # the k8s vmauth Pocket ID client (metrics + alertmanager redirects)
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/vmauth/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /secrets/cookie_secret
      OAUTH2_PROXY_COOKIE_NAME: _oauth2_victoria_metrics
      OAUTH2_PROXY_REDIRECT_URL: "https://metrics.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: openid email profile groups
      OAUTH2_PROXY_ALLOWED_GROUPS: admin        # Pocket ID admin group only
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [monitoring]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  monitoring: {external: true}   # monitoring stack network (truenas/networks.yaml), Caddy is its ingress
