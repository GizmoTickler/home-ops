# blackbox-exporter modules (truenas/apps/blackbox-exporter). Rendered by the reconciler (domain via 1Password).
# ICMP needs no capability: Docker sets net.ipv4.ping_group_range for containers (unprivileged ICMP sockets).
# Probes leave nas01 as 192.168.123.157 (SGT 25): what they may reach is set by SC01 TrustSec
# (infrastructure-automation inventory/host_vars/sc01/trustsec.yml), so a timeout can be a policy block.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      follow_redirects: true
      preferred_ip_protocol: ip4
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  # A real DNS answer, not just an open port: the SOA of the home zone through dnsdist -> recursor -> auth.
  # Works with no internet (the zone is served locally) and fails if any of the three is broken.
  dns_soa:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: ip4
      query_name: "{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      query_type: SOA
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: ["IN\\s+SOA\\s"]
  dns_soa_tcp:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: tcp
      preferred_ip_protocol: ip4
      query_name: "{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      query_type: SOA
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: ["IN\\s+SOA\\s"]
  dns_dot:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: tcp
      preferred_ip_protocol: ip4
      dns_over_tls: true
      tls_config:
        server_name: "dns.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      query_name: "{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      query_type: SOA
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: ["IN\\s+SOA\\s"]
  dns_doh:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
      headers:
        Accept: application/dns-message
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
  # TCP+TLS handshake probe for ZoneCore NTS-KE (:4460); wire into VictoriaMetrics scrape.yaml.tmpl once
  # nts_server_enabled=true (post-NS07) and SC01 TrustSec permits SGT 25 -> 11 TCP/4460.
  # Note: blackbox-exporter v0.29.1 only implements http/tcp/dns(udp|tcp+DoT)/icmp/grpc/unix probers —
  # it has NO native QUIC (DoQ UDP/853) or binary UDP NTPv4 (UDP/123) prober. Active NTPv4 probing of
  # 10.123.123.123/124 runs in truenas/apps/node-exporter/ntp-probe.py (textfile collector, SGT 15 -> 60).
  nts_ke_tls:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      tls: true
      tls_config:
        server_name: "dns.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
