# blackbox-exporter — ICMP/TCP/HTTP/DNS probes for VictoriaMetrics (devices, DNS, NFS, internet RTT, Envoy cert expiry).
# Listens: blackbox-exporter:9115 on the `monitoring` network (scraped by victoria-metrics only).
# Config:  blackbox.yml (modules). Probes leave via the `egress` bridge, SNAT to 192.168.123.157 (SC01 TrustSec
#          SGT 25, monitoring only); probes of nas01's own IPs stay on the host.
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    restart: unless-stopped
    user: "65534:65534"
    environment:
      TZ: America/New_York
    command: ["--config.file=/etc/blackbox/blackbox.yml", "--web.listen-address=:9115"]
    networks:
      monitoring: {}
      egress:
        gw_priority: 100          # default route: everything off-host leaves as 192.168.123.157 (SGT 25)
    volumes:
      - /mnt/flashstor/apps/blackbox-exporter-config:/etc/blackbox:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  monitoring: {external: true}   # monitoring stack network (truenas/networks.yaml), Caddy is its ingress
  # Off-host egress (scrapes/probes) SNATs to 192.168.123.157 = SC01 TrustSec SGT 25 (monitoring), not nas01's
  # SGT 15. .157 is a host alias on nas01 br0 (TrueNAS network config, not this repo). A bridge + SNAT, not the mgmt
  # macvlan: a macvlan child cannot reach its parent host, and the stack probes/scrapes nas01's own IPs.
  egress:
    driver: bridge
    driver_opts:
      com.docker.network.host_ipv4: 192.168.123.157
