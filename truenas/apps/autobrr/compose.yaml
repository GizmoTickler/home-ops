# autobrr — IRC announce -> download automation (Pocket ID via its own OIDC)
# Listens: autobrr:80 (+ metrics 9094) on the shared `apps` network; https://autobrr.<domain> via Caddy.
# Data:    /mnt/flashstor/apps/autobrr-config
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  autobrr:
    image: ghcr.io/autobrr/autobrr:v1.88.0@sha256:e200008d43fe6cd2d944c9bcf20900cfb8ba8a8e509625bb78ee51910b994005
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      AUTOBRR__CHECK_FOR_UPDATES: "false"
      AUTOBRR__HOST: "0.0.0.0"
      AUTOBRR__PORT: "80"
      AUTOBRR__LOG_LEVEL: "INFO"
      AUTOBRR__METRICS_ENABLED: "true"
      AUTOBRR__METRICS_HOST: "0.0.0.0"
      AUTOBRR__METRICS_PORT: "9094"
      AUTOBRR__OIDC_ENABLED: "true"
      AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
      AUTOBRR__OIDC_ISSUER: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      AUTOBRR__OIDC_REDIRECT_URL: "https://autobrr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/api/auth/oidc/callback"
      AUTOBRR__OIDC_CLIENT_ID: "{{ op://Infrastructure/autobrr/OIDC_CLIENT_ID }}"
      AUTOBRR__OIDC_CLIENT_SECRET: "{{ op://Infrastructure/autobrr/OIDC_CLIENT_SECRET }}"
      AUTOBRR__SESSION_SECRET: "{{ op://Infrastructure/autobrr/AUTOBRR_SESSION_SECRET }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/autobrr-config:/config
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000
      - /config/log:size=64m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 1024M}
    logging: *logging

  irc-keepalive:
    image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "65532:65532"
    command: ["/bin/sh", "-c", "while true; do python3 /app/keepalive.py || true; sleep 604800; done"]
    environment:
      TZ: "America/New_York"
      IRC_NICK: "{{ op://Infrastructure/Torrentleech/IRC_NICK }}"
      IRC_NICK_PASS: "{{ op://Infrastructure/Torrentleech/IRC_NICK_PASS }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/autobrr-config/keepalive.py:/app/keepalive.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}
    logging: *logging

networks:
  apps: {external: true}
