# Prowlarr — Indexer manager for the *arr apps
# Listens: prowlarr:80 on the shared `apps` network; https://prowlarr.<domain> via Caddy (Pocket ID forward-auth: oauth2-proxy service prowlarr-auth).
# Data:    /mnt/flashstor/apps/prowlarr-config
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  prowlarr:
    image: ghcr.io/home-operations/prowlarr:2.6.5.5623@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      PROWLARR__APP__INSTANCENAME: "Prowlarr"
      PROWLARR__APP__THEME: "dark"
      PROWLARR__AUTH__METHOD: "External"
      PROWLARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      PROWLARR__LOG__DBENABLED: "False"
      PROWLARR__SERVER__PORT: "80"
      PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }},prowlarr"
      PROWLARR__UPDATE__BRANCH: "develop"
      PROWLARR__AUTH__APIKEY: "{{ op://Infrastructure/prowlarr/PROWLARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/prowlarr-config:/config
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 1024M}
    logging: *logging

  prowlarr-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "prowlarr"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/prowlarr/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_prowlarr"
      OAUTH2_PROXY_REDIRECT_URL: "https://prowlarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  apps: {external: true}
