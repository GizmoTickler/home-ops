# Prowlarr — Indexer manager for the *arr apps
# Listens: prowlarr:80 on the shared `apps` network; https://prowlarr.<domain> via Envoy (Pocket ID OAuth2).
# Data:    /mnt/flashstor/apps/prowlarr-config
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  prowlarr:
    image: ghcr.io/home-operations/prowlarr:2.6.5.5623@sha256:0e2e6e9a2a16683a160ff1c6830d8192231a0502ab0d605b416023b2ca225ff9
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      PROWLARR__APP__INSTANCENAME: "Prowlarr"
      PROWLARR__APP__THEME: "dark"
      PROWLARR__AUTH__METHOD: "External"
      PROWLARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      PROWLARR__LOG__DBENABLED: "False"
      PROWLARR__SERVER__PORT: "80"
      PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }},prowlarr"
      PROWLARR__UPDATE__BRANCH: "develop"
      PROWLARR__AUTH__APIKEY: "{{ op://Infrastructure/prowlarr/PROWLARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/prowlarr-config:/config
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 1024M}
    logging: *logging

networks:
  apps: {external: true}
