# NZBGet — Usenet downloader.
# Listens: 192.168.123.154:6789 (web UI/API on the LAN) and nzbget:6789 on the shared `apps` network
#          (Caddy -> https://nzbget.<domain> behind Pocket ID; *arr apps)
# Data:    config /mnt/flashstor/apps/nzbget-config (nzbget.conf rendered from nzbget.conf.tmpl + 1Password)
#          scratch /mnt/flashstor/apps/nzbget-incomplete, completed -> /mnt/flashstor/data/usenet (no NFS)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  nzbget:
    image: ghcr.io/nzbgetcom/nzbget:v26.3@sha256:f451d98066cbc0c108146420a61a60f7638de50e067738951461e0105eeaa56d
    restart: unless-stopped
    environment:
      TZ: America/New_York
      PUID: "1000"              # owner of flashstor/data (kubernetesapps), as in k8s
      PGID: "1000"
    ports:
      - {host_ip: 192.168.123.154, target: 6789, published: "6789", protocol: tcp}   # SGT 15 on SC01
    networks:
      default:
        gw_priority: 1          # egress + replies for the published port stay on the app's own bridge
      apps: {}
    volumes:
      - /mnt/flashstor/apps/nzbget-config:/config
      - /mnt/flashstor/apps/nzbget-incomplete:/incomplete
      - /mnt/flashstor/data/usenet:/media/usenet
    tmpfs:
      - /tmp:size=1g
    deploy:
      resources:
        limits:
          cpus: "8"             # par2/unrar must not starve NFS + NVMe-oF serving
          memory: 20480M        # ArticleCache 12000 MB + ParBuffer 1024 MB + write buffers + unrar
    logging: *logging

  nzbget-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "d12606ec-7c67-46aa-b990-8bba4b782ffe"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/nzbget/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_nzbget"
      OAUTH2_PROXY_REDIRECT_URL: "https://nzbget.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  apps: {external: true}

x-portals:
  - {name: Web UI, scheme: http, host: 192.168.123.154, port: 6789, path: /}
