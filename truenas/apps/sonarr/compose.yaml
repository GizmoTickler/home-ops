# Sonarr — TV series manager
# Listens: sonarr:80 on the shared `apps` network; https://sonarr.<domain> via Caddy (Pocket ID forward-auth: oauth2-proxy service sonarr-auth).
# Data:    /mnt/flashstor/apps/sonarr-config; media /mnt/flashstor/data (/media)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  sonarr:
    image: ghcr.io/home-operations/sonarr:4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      SONARR__APP__INSTANCENAME: "Sonarr"
      SONARR__APP__THEME: "dark"
      SONARR__AUTH__METHOD: "External"
      SONARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      SONARR__LOG__DBENABLED: "False"
      SONARR__SERVER__PORT: "80"
      SONARR__SERVER__ALLOWEDHOSTS: "sonarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }},sonarr"
      SONARR__UPDATE__BRANCH: "develop"
      SONARR__AUTH__APIKEY: "{{ op://Infrastructure/sonarr/SONARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/sonarr-config:/config
      - /mnt/flashstor/data:/media
    tmpfs:
      - /tmp:size=512m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 2048M}
    logging: *logging

  sonarr-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "sonarr"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/sonarr/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_sonarr"
      OAUTH2_PROXY_REDIRECT_URL: "https://sonarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      SONARR_API_KEY: "{{ op://Infrastructure/sonarr/SONARR_API_KEY }}"
      RADARR_API_KEY: "{{ op://Infrastructure/radarr/RADARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/recyclarr-config:/config
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
    logging: *logging

networks:
  apps: {external: true}
