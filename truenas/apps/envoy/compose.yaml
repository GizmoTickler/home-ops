# Envoy — HTTPS ingress for every nas01 web app (native OAuth2 via Pocket ID; replaces Caddy + oauth2-proxy sidecars).
# Listens: 192.168.123.156:443/80 on the shared `mgmt` macvlan (LAN; SC01 sgt-map 192.168.123.156 sgt 15)
#          172.31.200.254:443 on the shared `apps` network (apps reach <host>.<domain> here via the aliases below)
#          172.31.200.254:8443 external sites only -- the cloudflared tunnel connector is its only client
#          172.31.200.254:9093 alertmanager ingest bridge -- restricted by RBAC to webhook (172.31.200.253/32)
#          172.31.201.254:9180 /metrics (Envoy's own) and /cloudflared/metrics (proxied to cloudflared:2000, which
#          stays off `monitoring`) -- monitoring network only; and 172.31.201.254:443 for the monitoring stack
# Health:  active HTTP health checks on the OAuth2-protected app clusters (envoy_cluster_membership_healthy)
# Certs:   wildcard *.<domain> issued/renewed by `lego` sidecar (Let's Encrypt DNS-01 via Cloudflare) into
#          /mnt/flashstor/apps/envoy-certs; Envoy hot-reloads via watched_directory.
# Config:  envoy.yaml + acme-renew.sh rendered by the reconciler to /mnt/flashstor/apps/envoy-config.
#          Hostnames not migrated yet fall through to the k8s gateways (192.168.255.11 / .12).
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  envoy:
    image: docker.io/envoyproxy/envoy:v1.40.2@sha256:8de97e654644827d62afdbf7e1d3dc9fee01a8690d410dd1c63a30dc6b6cecbb
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    environment:
      TZ: America/New_York
    networks:
      mgmt:
        ipv4_address: 192.168.123.156
        gw_priority: 100          # default route: LAN replies + external egress leave from .156
      apps:
        ipv4_address: 172.31.200.254
        aliases:
          - "actual.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "alertmanager.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "atuin.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "audiobookshelf.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "autobrr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "bazarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "caddy-test.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "chaptarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "envoy-test.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "grafana.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "grimmory.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "home-assistant.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "homeassistant.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "it-tools.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "kromgo.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "metrics.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "n8n.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "n8n-webhook.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "nzbget.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "pinchflat.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "prowlarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "qbittorrent.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "qui.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "radarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "requests.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "rss.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "sh.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "sonarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "status.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "vmalert.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "webhook.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      monitoring:
        ipv4_address: 172.31.201.254
        aliases:
          - "actual.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "alertmanager.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "atuin.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "audiobookshelf.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "autobrr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "bazarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "caddy-test.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "chaptarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "envoy-test.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "grafana.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "grimmory.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "home-assistant.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "homeassistant.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "it-tools.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "kromgo.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "metrics.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "n8n.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "n8n-webhook.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "nzbget.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "pinchflat.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "prowlarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "qbittorrent.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "qui.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "radarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "requests.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "rss.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "sh.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "sonarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "status.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "vmalert.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
          - "webhook.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
    volumes:
      - /mnt/flashstor/apps/envoy-config:/etc/envoy:ro
      - /mnt/flashstor/apps/envoy-certs:/certs:ro
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 1024M}
    logging: *logging

  lego:
    image: docker.io/goacme/lego:v5.6.0@sha256:6f1583fc026a455ea46a7a5858c576105bb69c2e2de69db391cab7f14750350c
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    depends_on: [envoy]
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/etc/envoy/acme-renew.sh"]
    environment:
      TZ: America/New_York
      DOMAIN: "{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      ACME_EMAIL: "{{ op://Infrastructure/cert-manager/ACME_EMAIL }}"
      CF_DNS_API_TOKEN: "{{ op://Infrastructure/cloudflare/CLOUDFLARE_DNS_TOKEN }}"
      # Google Trust Services EAB (primary CA); read by lego from env, never on argv. LE is the fallback.
      LEGO_EAB_KID: "{{ op://Infrastructure/cert-manager/EAB_KEY_ID }}"
      LEGO_EAB_HMAC: "{{ op://Infrastructure/cert-manager/EAB_HMAC_KEY }}"
      CLOUDFLARE_PROPAGATION_TIMEOUT: "120"
      CLOUDFLARE_POLLING_INTERVAL: "5"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/envoy-config:/etc/envoy:ro
      - /mnt/flashstor/apps/envoy-certs:/certs
    tmpfs:
      - /tmp:size=16m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.2", memory: 128M}
    logging: *logging

networks:
  mgmt: {external: true}
  apps: {external: true}
  monitoring: {external: true}   # monitoring stack (truenas/networks.yaml); Envoy is its only ingress

x-portals:
  - {name: Status, scheme: https, host: 192.168.123.156, port: 443, path: /}
