critical: true
order: 20
validate:                 # preflight: the target image validates the fully rendered envoy.yaml
  service: envoy
  entrypoint: envoy
  args: ["--mode", "validate", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
