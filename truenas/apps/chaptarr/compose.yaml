# Chaptarr — Book/audiobook manager
# Listens: chaptarr:80 on the shared `apps` network; https://chaptarr.<domain> via Caddy (Pocket ID forward-auth: oauth2-proxy service chaptarr-auth).
# Data:    /mnt/flashstor/apps/chaptarr-config; media /mnt/flashstor/data (/media)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  chaptarr:
    image: docker.io/chaptarr/chaptarr:0.9.965@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      CHAPTARR__APP__INSTANCENAME: "Chaptarr"
      CHAPTARR__APP__THEME: "dark"
      CHAPTARR__AUTH__METHOD: "External"
      CHAPTARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      CHAPTARR__SERVER__PORT: "80"
      CHAPTARR__UPDATE__BRANCH: "develop"
      CHAPTARR__AUTH__APIKEY: "{{ op://Infrastructure/chaptarr/CHAPTARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/chaptarr-config:/config
      - /mnt/flashstor/data:/media
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 2048M}
    logging: *logging

  chaptarr-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "chaptarr"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/chaptarr/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_chaptarr"
      OAUTH2_PROXY_REDIRECT_URL: "https://chaptarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  apps: {external: true}
