# Chaptarr — Book/audiobook manager
# Listens: chaptarr:80 on the shared `apps` network; https://chaptarr.<domain> via Envoy (Pocket ID OAuth2).
# Data:    /mnt/flashstor/apps/chaptarr-config; media /mnt/flashstor/data (/media)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  chaptarr:
    image: docker.io/chaptarr/chaptarr:0.9.965@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      CHAPTARR__APP__INSTANCENAME: "Chaptarr"
      CHAPTARR__APP__THEME: "dark"
      CHAPTARR__AUTH__METHOD: "External"
      CHAPTARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      CHAPTARR__SERVER__PORT: "80"
      CHAPTARR__UPDATE__BRANCH: "develop"
      CHAPTARR__AUTH__APIKEY: "{{ op://Infrastructure/chaptarr/CHAPTARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/chaptarr-config:/config
      - /mnt/flashstor/data:/media
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 2048M}
    logging: *logging

networks:
  apps: {external: true}
