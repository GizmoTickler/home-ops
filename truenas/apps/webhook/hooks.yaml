---
# Hooks for the nas01 webhook app (truenas/apps/webhook).
# Every hook requires ?token=<64 hex chars> (regex AND exact match: fails closed); the secret lives only on nas01 in
# /mnt/flashstor/apps/webhook-secret/token (root:1000 0640, dir 0750; mounted at /secret/token), never in git; the
# container refuses to start without it. Senders (Sonarr, Radarr,
# Seerr, ntopng) carry it in their webhook URL. ntopng-alertmanager is additionally limited to nflo0's IP in Caddy.
# Sonarr/Radarr API targets and app URLs come from env (never from the request or payload).
- id: seerr-pushover
  execute-command: /config/seerr-pushover.sh
  command-working-directory: /config
  trigger-rule:
    and:
      # fail closed: an empty/short token never matches, even if the secret file were empty
      - match: {type: regex, regex: '^[0-9a-f]{64}$', parameter: {source: url, name: token}}
      - match:
          type: value
          value: '{{ cat `/secret/token` }}'
          parameter: {source: url, name: token}
  pass-arguments-to-command:
    - source: string
      name: '{{ getenv "SEERR_PUSHOVER_URL" }}'
    - source: entire-payload

- id: radarr-pushover
  execute-command: /config/radarr-pushover.sh
  command-working-directory: /config
  trigger-rule:
    and:
      # fail closed: an empty/short token never matches, even if the secret file were empty
      - match: {type: regex, regex: '^[0-9a-f]{64}$', parameter: {source: url, name: token}}
      - match:
          type: value
          value: '{{ cat `/secret/token` }}'
          parameter: {source: url, name: token}
  pass-environment-to-command:
    - envname: RADARR_PUSHOVER_URL
      source: string
      name: '{{ getenv "RADARR_PUSHOVER_URL" }}'
    - envname: RADARR_EVENT_TYPE
      source: payload
      name: eventType
    - envname: RADARR_MOVIE_TITLE
      source: payload
      name: movie.title
    - envname: RADARR_MOVIE_YEAR
      source: payload
      name: movie.year
    - envname: RADARR_MOVIE_OVERVIEW
      source: payload
      name: movie.overview
    - envname: RADARR_MOVIE_TMDB_ID
      source: payload
      name: movie.tmdbId
    - envname: RADARR_DOWNLOAD_CLIENT
      source: payload
      name: downloadClient

