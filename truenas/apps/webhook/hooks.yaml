- id: truenas-gitops
  execute-command: /config/truenas-gitops.sh
  command-working-directory: /config
  trigger-rule-mismatch-http-response-code: 403
  trigger-rule:
    and:
      - match:
          type: regex
          regex: '^sha256=[0-9a-f]{64}$'
          parameter: {source: header, name: X-Hub-Signature-256}
      - match:
          type: payload-hmac-sha256
          secret: '{{ getenv "GITHUB_WEBHOOK_SECRET" }}'
          parameter: {source: header, name: X-Hub-Signature-256}
      - match:
          type: regex
          regex: '^(ping|push|check_run)$'
          parameter: {source: header, name: X-GitHub-Event}
  pass-environment-to-command:
    - envname: GITHUB_EVENT
      source: header
      name: X-GitHub-Event
    - envname: GH_REPO
      source: payload
      name: repository.full_name
    - envname: GH_REF
      source: payload
      name: ref
    - envname: GH_ACTION
      source: payload
      name: action
    - envname: GH_CHECK_NAME
      source: payload
      name: check_run.name
    - envname: GH_CHECK_CONCLUSION
      source: payload
      name: check_run.conclusion
    - envname: GH_HEAD_BRANCH
      source: payload
      name: check_run.check_suite.head_branch
