# smartctl-exporter — SMART metrics for nas01's disks (scraped as job="smartctl-exporter").
# Listens: 192.168.120.10:9633. Privileged root: required to issue SMART commands to the host's devices.
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  smartctl-exporter:
    # PINNED to v0.14.0: v0.15.0 answers HTTP 500 on every scrape because the SAS drives (sdr-sdu) report
    # smartctl_verify_* / smartctl_scsi_percentage_used_endurance_indicator values whose descriptors v0.15.0 never
    # registers ("collected metric ... with unregistered descriptor"; upstream issue
    # prometheus-community/smartctl_exporter#406, fix in PR #397). Unpin -- and drop the matching rule in
    # .renovaterc.json5 -- once a release containing that fix ships.
    image: quay.io/prometheuscommunity/smartctl-exporter:v0.14.0@sha256:cfe22c36d7d2fac48ebf619707305acb65eb0fb670656eb80f356e606d782bc1
    restart: unless-stopped
    user: root
    privileged: true
    environment:
      TZ: America/New_York
    command:
      - --smartctl.device-exclude=nvme0
    ports:
      - {host_ip: 192.168.120.10, target: 9633, published: 9633, protocol: tcp}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *logging
