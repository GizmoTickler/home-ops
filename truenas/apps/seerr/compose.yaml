# Seerr — Media request manager
# Listens: seerr:80 on the shared `apps` network; https://requests.<domain> via Envoy (Pocket ID OAuth2).
# Data:    /mnt/flashstor/apps/seerr-config
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0@sha256:c33702abebcec295b69a1371417b3a350e31dfeacbae3158e790c86908dc3659
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      LOG_LEVEL: "info"
      PORT: "80"
      CONFIG_DIRECTORY: "/app/config"
      API_KEY: "{{ op://Infrastructure/seerr/SEERR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/seerr-config:/app/config
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000
      - /app/config/logs:size=64m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 512M}
    logging: *logging

networks:
  apps: {external: true}
