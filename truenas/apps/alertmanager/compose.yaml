# Alertmanager — routes nas01 vmalert alerts to Pushover (+ Watchdog heartbeat). Same routes/receivers as k8s.
# Listens: alertmanager:9093 on the `monitoring` network; https://alertmanager.<domain> via Envoy (Pocket ID OAuth2).
# Data:    /mnt/flashstor/apps/alertmanager-data (silences/nflog copied from k8s); config alertmanager.yml rendered
#          by the reconciler from alertmanager.yml.tmpl (Pushover/heartbeat secrets from 1Password).
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: America/New_York
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager/alertmanager-db
      - --web.listen-address=:9093
      - --web.external-url=https://alertmanager.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}
      - --cluster.listen-address=
    networks: [monitoring]
    volumes:
      - /mnt/flashstor/apps/alertmanager-config:/etc/alertmanager:ro
      - /mnt/flashstor/apps/alertmanager-data:/alertmanager
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}
    logging: *logging

networks:
  monitoring: {external: true}   # monitoring stack network (truenas/networks.yaml), Caddy is its ingress
