# Radarr — Movie manager
# Listens: radarr:80 on the shared `apps` network; https://radarr.<domain> via Caddy (Pocket ID forward-auth: oauth2-proxy service radarr-auth).
# Data:    /mnt/flashstor/apps/radarr-config; media /mnt/flashstor/data (/media)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  radarr:
    image: ghcr.io/home-operations/radarr:6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
      RADARR__APP__INSTANCENAME: "Radarr"
      RADARR__APP__THEME: "dark"
      RADARR__AUTH__METHOD: "External"
      RADARR__AUTH__REQUIRED: "DisabledForLocalAddresses"
      RADARR__LOG__DBENABLED: "False"
      RADARR__SERVER__PORT: "80"
      RADARR__SERVER__ALLOWEDHOSTS: "radarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }},radarr"
      RADARR__UPDATE__BRANCH: "develop"
      RADARR__AUTH__APIKEY: "{{ op://Infrastructure/radarr/RADARR_API_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/radarr-config:/config
      - /mnt/flashstor/data:/media
    tmpfs:
      - /tmp:size=512m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "4", memory: 2048M}
    logging: *logging

  radarr-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "radarr"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/radarr/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_radarr"
      OAUTH2_PROXY_REDIRECT_URL: "https://radarr.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  apps: {external: true}
