# Bazarr — Subtitle manager for Sonarr/Radarr
# Listens: bazarr:6767 on the shared `apps` network; https://bazarr.<domain> via Envoy (Pocket ID OAuth2).
# Data:    /mnt/flashstor/apps/bazarr-config; media /mnt/flashstor/data (/media)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  bazarr:
    image: ghcr.io/home-operations/bazarr:1.6.2@sha256:b8434a7339ebd9c2bfe4464c28db79944e0f52f47da85345fc7e0563c19f83ac
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "America/New_York"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/bazarr-config:/config
      - /mnt/flashstor/data:/media
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
      - /config/cache:size=512m,uid=1000,gid=1000
      - /config/log:size=64m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 1024M}
    logging: *logging

networks:
  apps: {external: true}
