# qBittorrent — torrent client, VPN-only egress.
# Listens: 192.168.123.155:8080 (web UI, mgmt leg; behind Pocket ID via k8s Service qbittorrent.downloads)
#          192.168.90.20 / bc:24:11:90:00:20 on VLAN 90 = the ONLY default route (gateway0 VPN policy + DNAT 29867)
# Data:    config /mnt/flashstor/apps/qbittorrent-config, scratch /mnt/flashstor/apps/qbittorrent-inter,
#          completed -> /mnt/flashstor/data/torrents
# Kill-switch: no route to the internet except via vpn; mgmt network is `internal: true`. app.yaml binds torrents
# to 192.168.90.20 (vpn-only address; interface NAMES are not stable across recreates) in qBittorrent.conf.
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  qbittorrent:
    image: ghcr.io/home-operations/qbittorrent-libtorrentv1:5.2.4@sha256:6c303adb93d995ba33dcdce45ee89181a370b6ad745b4148e7f73bde43e5d482
    user: "1000:1000"
    environment:
      UMASK: "022"
      QBT_WEBUI_PORT: "8080"
      TZ: America/New_York
    volumes:
      - /mnt/flashstor/apps/qbittorrent-config:/config
      - /mnt/flashstor/apps/qbittorrent-inter:/inter
      - /mnt/flashstor/data/torrents:/media/torrents
    tmpfs:
      - /tmp:size=1g
      - /config/qBittorrent/logs:size=256m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    dns: [192.168.123.249]          # MGMT DNS VIP, on-link via the mgmt leg (same resolver as before via CoreDNS)
    networks:
      vpn:
        ipv4_address: 192.168.90.20
        mac_address: "bc:24:11:90:00:20"
        gw_priority: 100
      mgmt:
        ipv4_address: 192.168.123.155
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 20480M         # MemoryWorkingSetLimit=16384 in qBittorrent.conf + headroom
    restart: unless-stopped
    logging: *logging
networks:
  vpn:
    driver: macvlan
    driver_opts:
      parent: vlan90
      com.docker.network.driver.mtu: "1420"
    ipam:
      config:
        - subnet: 192.168.90.0/24
          gateway: 192.168.90.1
  mgmt:
    driver: macvlan
    internal: true                 # never a default route
    driver_opts:
      parent: br0
    ipam:
      config:
        - subnet: 192.168.120.0/22
          gateway: 192.168.123.254

x-portals:
  - {name: Web UI, scheme: http, host: 192.168.123.155, port: 8080, path: /}
