# qBittorrent — torrent client, VPN-only egress through one AirVPN WireGuard tunnel (gluetun).
# Listens: 192.168.123.155:8080 (web UI, shared `mgmt` macvlan) and qbittorrent:8080 on the shared `apps` network
#          (Caddy -> https://qbittorrent.<domain> behind Pocket ID; *arr apps / qui talk to it there)
#          AirVPN forwarded port 29867 inbound on the tunnel (FIREWALL_VPN_INPUT_PORTS)
# Network: qbittorrent shares gluetun's netns. gluetun = AirVPN Chicago (Sadalsuud), kernel WireGuard; its outer UDP
#          leaves via the `wan` bridge (NAT to nas01 -> UXG -> Frontier). One tunnel = one stable public IP, which is
#          what private trackers require (no multi-tunnel split/ECMP). Single-tunnel ceiling ~1.7-2.5 G (one nas01
#          core in softirq), measured 2026-11-12.
# Data:    config /mnt/flashstor/apps/qbittorrent-config, scratch /mnt/flashstor/apps/qbittorrent-inter,
#          completed -> /mnt/flashstor/data/torrents
# Kill-switch: gluetun's firewall drops everything outside the tunnel except local subnets; app.yaml also binds
#          torrents to interface tun0 in qBittorrent.conf, so a missing tunnel means qBittorrent cannot bind at all.
#          wan carries gw_priority 100, so neither mgmt nor apps ever becomes the default route.
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      TZ: America/New_York
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_IMPLEMENTATION: kernelspace   # v3.41: kernelspace|userspace|auto ("kernel" is rejected)
      WIREGUARD_ENDPOINT_IP: 68.235.35.181          # AirVPN Sadalsuud (Chicago)
      WIREGUARD_ENDPOINT_PORT: "51820"
      WIREGUARD_PUBLIC_KEY: PyLCXAQT8KkM4T+dUsOQfn+Ub3pGxfGlxkIApuig+hk=
      WIREGUARD_PRIVATE_KEY: "{{ op://Infrastructure/wviqdpxmhrphizw6bv3blh6v2m/private_key }}"
      WIREGUARD_PRESHARED_KEY: "{{ op://Infrastructure/wviqdpxmhrphizw6bv3blh6v2m/preshared_key }}"
      WIREGUARD_ADDRESSES: "{{ op://Infrastructure/wviqdpxmhrphizw6bv3blh6v2m/address }}"
      WIREGUARD_MTU: "1320"                   # AirVPN default
      FIREWALL_VPN_INPUT_PORTS: "29867"       # AirVPN forwarded port -> qBittorrent Session\Port
      HEALTH_TARGET_ADDRESSES: 1.1.1.1:443
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000   # control API (can stop the VPN) never exposed on mgmt0
    sysctls:                        # per-netns (qbittorrent shares this netns): host bbr/fq does not carry over
      net.ipv4.tcp_congestion_control: bbr
      net.ipv4.tcp_mtu_probing: "1"
    networks:
      wan:
        interface_name: eth0
        gw_priority: 100
      mgmt:
        interface_name: mgmt0
        ipv4_address: 192.168.123.155
      apps:
        interface_name: apps0
        aliases: [qbittorrent]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 512M
    restart: unless-stopped
    logging: *logging

  qbittorrent:
    image: ghcr.io/home-operations/qbittorrent-libtorrentv1:5.3.0@sha256:74a9dd7824d960e1c3355ab07ba23c9946aa18236eebac0c51fe9f5cac35ff8f
    user: "1000:1000"
    network_mode: service:gluetun
    depends_on:
      gluetun: {condition: service_healthy}
    environment:
      UMASK: "022"
      QBT_WEBUI_PORT: "8080"
      TZ: America/New_York
    volumes:
      - /mnt/flashstor/apps/qbittorrent-config:/config
      - /mnt/flashstor/apps/qbittorrent-inter:/inter
      - /mnt/flashstor/data/torrents:/media/torrents
    tmpfs:
      - /tmp:size=1g
      - /config/qBittorrent/logs:size=256m,uid=1000,gid=1000
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 20480M         # MemoryWorkingSetLimit=16384 in qBittorrent.conf + headroom
    restart: unless-stopped
    logging: *logging

  qbittorrent-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.13.0@sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: "America/New_York"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_CLIENT_ID: "qbittorrent"
      OAUTH2_PROXY_CLIENT_SECRET: "{{ op://Infrastructure/qbittorrent/OIDC_CLIENT_SECRET }}"
      OAUTH2_PROXY_COOKIE_SECRET_FILE: "/secrets/cookie_secret"
      OAUTH2_PROXY_COOKIE_NAME: "_oauth2_qbittorrent"
      OAUTH2_PROXY_REDIRECT_URL: "https://qbittorrent.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/oauth2/callback"
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_ALLOWED_GROUPS: "admin"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "static://202"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/auth-proxy:/secrets:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M}
    logging: *logging

networks:
  wan:
    driver: bridge                 # NAT via nas01; carries only gluetun's outer WireGuard UDP (+ local subnets)
  mgmt: {external: true}           # shared macvlan on br0 (truenas/networks.yaml)
  apps: {external: true}           # shared bridge: Caddy, *arr, qui

x-portals:
  - {name: Web UI, scheme: http, host: 192.168.123.155, port: 8080, path: /}
