# Reconciled by truenas/reconciler/reconcile.py (see truenas/README.md).
# nas01-specific settings pinned in the app-owned config (existing keys only; the app is stopped while patching).
# Keys are matched verbatim and section-blind: qBittorrent 5.x keeps the WebUI keys unprefixed under [WebUI]
# (the port comes from QBT_WEBUI_PORT).
ini:
  - path: /mnt/flashstor/apps/qbittorrent-config/qBittorrent/qBittorrent.conf
    set:
      # Caddy only (fixed 172.31.200.2; every Caddy route to qBittorrent is behind Pocket ID forward_auth).
      # *arr/qui authenticate with op://Infrastructure/qbittorrent/QBITTORRENT_USERNAME/PASSWORD.
      # k8s node /32s go once the *arr apps are off k8s (phase 2).
      'AuthSubnetWhitelist': "127.0.0.1/32, 172.31.200.2/32, 192.168.122.10/32, 192.168.122.11/32, 192.168.122.12/32"
      'AuthSubnetWhitelistEnabled': "true"
      # Bind torrent traffic to the AirVPN tunnel: tun0 (gluetun default VPN_INTERFACE) exists only inside gluetun's netns (shared with qbittorrent).
      # If the tunnel is down qBittorrent cannot bind at all (kill-switch, on top of gluetun's firewall).
      'Session\Interface': "tun0"
      'Session\InterfaceName': "tun0"
      'Session\InterfaceAddress': ""
health:
  tcp: 127.0.0.1:8080      # probed inside the container (netns): the host can't reach its own macvlan IPs
  netns: qbittorrent       # = gluetun's netns (network_mode: service:gluetun)
  timeout: 300            # large torrent sets load fastresume before the WebUI listens
ui:
  title: qBittorrent
  description: "Torrent client — VPN-only egress via one AirVPN tunnel (gluetun)"
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/qbittorrent.png
  home: https://www.qbittorrent.org
