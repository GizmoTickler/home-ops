# cloudflared — Cloudflare tunnel connector for the public hostnames (replaces the k8s `kubernetes` tunnel pods).
# Listens: nothing inbound; :2000 metrics on the `apps` network only (service name cloudflared). VictoriaMetrics
#          scrapes it as job=cloudflared via Envoy's monitoring-only listener (envoy:9180/cloudflared/metrics).
# Tunnel:  same tunnel as k8s (credentials from 1Password item `cloudflare`), wildcard ingress -> Envoy's external
#          listener https://envoy:8443 (TLS verified against the wildcard via originServerName).
# Config:  /mnt/flashstor/apps/cloudflared-config/{config.yaml,credentials.json} rendered by the reconciler.
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.0@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    user: "65532:65532"
    environment:
      TZ: America/New_York
      NO_AUTOUPDATE: "true"
      TUNNEL_ORIGIN_ENABLE_HTTP2: "true"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
    networks: [apps]   # NOT monitoring: internet-facing; metrics are scraped via Envoy (see header)
    volumes:
      - /mnt/flashstor/apps/cloudflared-config:/etc/cloudflared:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 256M}
    logging: *logging

networks:
  apps: {external: true}
