# Scrutiny (SMART dashboard) on nas01 (TrueNAS custom app). Reconciled from git by truenas/reconciler
# (see truenas/README.md). Migrated 2026-11-11 from the TrueNAS catalog app 1.3.19: same image digest, ports,
# env; data moved from ix-volumes to flashstor/apps/scrutiny-{config,influxdb}.
services:
  scrutiny:
    cap_add:
    - AUDIT_WRITE
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - FSETID
    - KILL
    - MKNOD
    - NET_BIND_SERVICE
    - NET_RAW
    - SETFCAP
    - SETGID
    - SETPCAP
    - SETUID
    - SYS_CHROOT
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
    environment:
      COLLECTOR_API_ENDPOINT: http://127.0.0.1:8080
      NVIDIA_VISIBLE_DEVICES: void
      SCRUTINY_WEB_DATABASE_LOCATION: /opt/scrutiny/config/scrutiny.db
      SCRUTINY_WEB_INFLUXDB_HOST: 127.0.0.1
      SCRUTINY_WEB_INFLUXDB_PORT: '8086'
      SCRUTINY_WEB_LISTEN_HOST: 0.0.0.0
      SCRUTINY_WEB_LISTEN_PORT: '8080'
      TZ: Etc/UTC
      UMASK: '002'
      UMASK_SET: '002'
    group_add:
    - 568
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
      - CMD
      - curl
      - --request
      - GET
      - --silent
      - --output
      - /dev/null
      - --show-error
      - --fail
      - http://127.0.0.1:8080/api/health
      timeout: 5s
    image: ghcr.io/analogj/scrutiny:v0.10.0-omnibus@sha256:90062edac57a2bd891d641344184f5f730f19394b1124f6fc53904a3d8cb21c2
    platform: linux/amd64
    ports:
    - mode: ingress
      protocol: tcp
      published: 31055
      target: 8086
    - host_ip: 192.168.123.153
      mode: ingress
      protocol: tcp
      published: 80
      target: 8080
    privileged: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges=true
    stdin_open: false
    tty: false
    user: 0:0
    volumes:
    - bind:
        create_host_path: false
        propagation: rprivate
      read_only: true
      source: /dev
      target: /dev
      type: bind
    - bind:
        create_host_path: false
        propagation: rprivate
      read_only: false
      source: /mnt/flashstor/apps/scrutiny-config
      target: /opt/scrutiny/config
      type: bind
    - bind:
        create_host_path: false
        propagation: rprivate
      read_only: false
      source: /mnt/flashstor/apps/scrutiny-influxdb
      target: /opt/scrutiny/influxdb
      type: bind
    - bind:
        create_host_path: false
        propagation: rprivate
      read_only: true
      source: /run/udev
      target: /run/udev
      type: bind
volumes: {}
x-portals:
- host: 0.0.0.0
  name: InfluxDB
  path: /
  port: 31055
  scheme: http
- host: 192.168.123.153
  name: Web UI
  path: /
  port: 80
  scheme: http
