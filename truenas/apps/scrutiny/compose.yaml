# Scrutiny — SMART dashboard (omnibus: web + collector + InfluxDB in one container).
# Listens: 192.168.123.153:80 (web UI). InfluxDB 8086 is NOT published (reached on 127.0.0.1 in-container; the
#          catalog app exposed it on every nas01 interface as 31055 with default credentials — removed 2026-11-11).
# Data:    /mnt/flashstor/apps/scrutiny-{config,influxdb} (migrated from the catalog app's ix-volumes 2026-11-11)
# Privileged + /dev + /run/udev read-only: required for smartctl against the host's disks.
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  scrutiny:
    image: ghcr.io/analogj/scrutiny:v0.10.0-omnibus@sha256:90062edac57a2bd891d641344184f5f730f19394b1124f6fc53904a3d8cb21c2
    restart: unless-stopped
    user: "0:0"
    privileged: true
    environment:
      TZ: America/New_York
      COLLECTOR_API_ENDPOINT: http://127.0.0.1:8080
      SCRUTINY_WEB_DATABASE_LOCATION: /opt/scrutiny/config/scrutiny.db
      SCRUTINY_WEB_INFLUXDB_HOST: 127.0.0.1
      SCRUTINY_WEB_INFLUXDB_PORT: "8086"
      SCRUTINY_WEB_LISTEN_HOST: 0.0.0.0
      SCRUTINY_WEB_LISTEN_PORT: "8080"
    ports:
      - {host_ip: 192.168.123.153, target: 8080, published: 80, protocol: tcp}
    volumes:
      - /mnt/flashstor/apps/scrutiny-config:/opt/scrutiny/config
      - /mnt/flashstor/apps/scrutiny-influxdb:/opt/scrutiny/influxdb
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
    security_opt: ["no-new-privileges=true"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 4096M}
    healthcheck:
      test: [CMD, curl, --silent, --output, /dev/null, --show-error, --fail, http://127.0.0.1:8080/api/health]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s
    logging: *logging

x-portals:
  - {name: Web UI, scheme: http, host: 192.168.123.153, port: 80, path: /}
