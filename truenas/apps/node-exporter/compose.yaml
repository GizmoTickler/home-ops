# node-exporter — nas01 host metrics (scraped as job="node-exporter").
# Listens: 192.168.120.10:9100
# Textfile collector: /mnt/flashstor/observability/node-exporter/textfile (truenas_apps_gitops_* from the reconciler)
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    environment:
      TZ: America/New_York
    hostname: nas01
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.udev.data=/host/root/run/udev/data
      - --web.listen-address=0.0.0.0:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/host/root/mnt/flashstor/observability/node-exporter/textfile
      - --collector.processes
    ports:
      - {host_ip: 192.168.120.10, target: 9100, published: 9100, protocol: tcp}
    volumes:
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    deploy:
      resources:
        limits: {cpus: "2", memory: 256M}
    logging: *logging

  zfs-collector:
    image: docker.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    restart: unless-stopped
    network_mode: service:node-exporter
    environment:
      TZ: America/New_York
      INTERVAL_SECONDS: "30"
      TEXTFILE_PATH: /textfile/zfs.prom
    command: ["python3", "-u", "/config/zfs-collector.py"]
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/zfs:/dev/zfs
    read_only: true
    volumes:
      - /:/host/root:ro
      - /mnt/flashstor/apps/node-exporter-config/zfs-collector.py:/config/zfs-collector.py:ro
      - /mnt/flashstor/observability/node-exporter/textfile:/textfile
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}
    logging: *logging
