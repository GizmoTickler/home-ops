# FreshRSS — RSS reader (Pocket ID login via its own OIDC)
# Listens: freshrss:8080 on the shared `apps` network; https://rss.<domain> via Caddy.
# Data:    /mnt/flashstor/apps/freshrss-data ({data,extensions})
# Managed by truenas/reconciler — edit here and merge (see truenas/README.md).
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  freshrss:
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    sysctls: {net.ipv4.tcp_congestion_control: bbr}   # per-netns; never inherit a changed host default
    restart: unless-stopped
    environment:
      TZ: "America/New_York"
      CRON_MIN: "*"
      LISTEN: "8080"
      DOMAIN: "rss.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}"
      OIDC_ENABLED: "1"
      OIDC_PROVIDER_METADATA_URL: "https://id.{{ op://Infrastructure/cluster-config/SECRET_DOMAIN }}/.well-known/openid-configuration"
      OIDC_REMOTE_USER_CLAIM: "preferred_username"
      OIDC_SCOPES: "openid email profile"
      OIDC_X_FORWARDED_HEADERS: "X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto"
      OIDC_CLIENT_ID: "{{ op://Infrastructure/freshrss/OIDC_CLIENT_ID }}"
      OIDC_CLIENT_SECRET: "{{ op://Infrastructure/freshrss/OIDC_CLIENT_SECRET }}"
      OIDC_CLIENT_CRYPTO_KEY: "{{ op://Infrastructure/freshrss/OIDC_CLIENT_CRYPTO_KEY }}"
    networks: [apps]
    volumes:
      - /mnt/flashstor/apps/freshrss-data/data:/var/www/FreshRSS/data
      - /mnt/flashstor/apps/freshrss-data/extensions:/var/www/FreshRSS/extensions
    deploy:
      resources:
        limits: {cpus: "1", memory: 384M}
    logging: *logging

networks:
  apps: {external: true}
