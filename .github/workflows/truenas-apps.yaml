---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: TrueNAS apps

on:
  pull_request:
    paths:
      - truenas/**
      - .github/workflows/truenas-apps.yaml
  push:
    branches:
      - main
    paths:
      - truenas/**

permissions:
  contents: read

jobs:
  lint:
    name: Lint nas01 apps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The job name ("Lint nas01 apps") is the check the reconciler's CI gate requires before it deploys a commit
      # (config.json ci_gate.check_name) -- rename both together.
      - name: Lint
        run: |
          python3 -m pip install --quiet pyyaml pytest prometheus-client
          python3 -m py_compile truenas/reconciler/*.py
          python3 truenas/reconciler/lint.py truenas/apps
      - name: Reconciler unit tests
        run: python3 -m pytest -q -p no:cacheprovider truenas/reconciler/tests
