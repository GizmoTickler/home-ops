# /etc/modules-load.d/homeops.conf — port of Talos machine.kernel.modules
# (Flatcar's files/modules-load-homeops.conf plus two FCOS-era additions).
# nbd        - network block device
# vfio-pci   - VFIO passthrough
# uio_pci_generic - generic UIO PCI
# ublk_drv   - userspace block device driver (nvmeublk data path)
# nvme_tcp   - NVMe/TCP initiator (scale-csi kernel data path)
nbd
vfio-pci
uio_pci_generic
ublk_drv
nvme_tcp
