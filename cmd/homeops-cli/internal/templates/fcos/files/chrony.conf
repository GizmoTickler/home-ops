# /etc/chrony.conf — Fedora CoreOS runs chronyd, not systemd-timesyncd, so the
# Flatcar /etc/systemd/timesyncd.conf NTP= list (port of Talos
# machine.time.servers) is carried here instead. Only the configured homelab
# servers are used: the stock FCOS "pool" line and the DHCP-provided sources
# (sourcedir /run/chrony-dhcp) are intentionally dropped so every node keeps
# the same five time sources it had on Flatcar. The remaining directives are
# the Fedora defaults.
{{ ENV.CHRONY_SERVERS }}
driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
