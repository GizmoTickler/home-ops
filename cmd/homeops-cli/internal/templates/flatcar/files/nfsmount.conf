# nconnect MUST match the trunking topology. The kernel applies nconnect to the
# session's PRIMARY address only, and adds exactly one transport per additional
# trunked address. So with N trunked addresses on N distinct links:
#
#   nconnect=1  -> 1 transport per link, balanced        <-- correct here
#   nconnect=4  -> 4:1:1:1 on four links, primary link saturates (the original bug)
#
# This value is 1 *because* cluster.nfs_trunk.vlans supplies one address per
# link (nas01 at 192.168.201.10 and 192.168.202.10). If this cluster is ever
# pointed at a SINGLE-ADDRESS NFS server, trunking contributes nothing and
# nconnect becomes the only parallelism knob — raise it back to 4. Measured on
# this fabric: one transport = 260 MiB/s single-stream; four transports on one
# link = 1119 MiB/s.
#
# Since 2026-10-16 only two addresses remain (192.168.203.10/204.10 were retired
# with nas01's 82599 ports; anchors to them hung the session). The balance rule
# still holds — nconnect=1 gives 1:1, nconnect=2 would give 2:1 — but the
# session now has 2 transports, not 4. The nconnect=1-beats-4 measurement
# (+17.9% read / +22.4% write) was taken on the four-link fabric and has NOT
# been repeated on two; re-measure before assuming 1 is still the faster
# setting here.
#
# Ideally the template should derive this rather than hardcode it:
#   nconnect={{ if gt (len .cluster.nfs_trunk.vlans) 1 }}1{{ else }}4{{ end }}
#
# max_connect MUST stay >= the number of trunked addresses. Its kernel default
# is 1, which forbids trunking outright — if a kubelet pod mount ever wins the
# boot race and establishes the session without it, the node loses multipath.
[ NFSMount_Global_Options ]
nfsvers=4.2
hard=True
nconnect=1
max_connect=16
noatime=True
rsize=1048576
wsize=1048576
