# /etc/nfsmount.conf — port of Talos machine.files /etc/nfsmount.conf (overwrite).
# Tuned NFS defaults for the TrueNAS NFS mounts (VolSync Kopia repo, media, OpenEBS).
[ NFSMount_Global_Options ]
nfsvers=4.2
hard=True
# nconnect creates 16 parallel TCP transports to the single NFS service IP.
# nfs-ecmp.service spreads those flows over all four storage paths by L4 hash.
nconnect=16
max_connect=1
noatime=True
rsize=1048576
wsize=1048576
